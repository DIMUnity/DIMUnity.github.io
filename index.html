<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>蔬食探索星圖</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <style>
    :root {
      --ig-bg: #000000;
      --ig-surface: #121212;
      --ig-card: #1c1c1e;
      --ig-card-hover: #26262a;
      --ig-border: #262626;
      --ig-border-light: #363636;
      --ig-text-main: #f5f5f5;
      --ig-text-sub: #a8a8a8;
      --ig-blue: #0095f6;
      --ig-heart: #ff3040;
      --ig-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --ig-gradient-glow: rgba(220, 39, 67, 0.4);
      --sidebar-width: 390px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      background: var(--ig-bg);
      color: var(--ig-text-main);
      position: relative;
    }

    /* ─── 登入攔截鎖定頁面 ─── */
    #auth-lock-screen {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .lock-card {
      background: var(--ig-surface);
      border: 1px solid var(--ig-border);
      padding: 36px 24px;
      border-radius: 20px;
      max-width: 350px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
    }

    .lock-logo-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--ig-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      box-shadow: 0 0 24px var(--ig-gradient-glow);
    }

    .lock-logo-inner {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .lock-title {
      font-size: 20px;
      font-weight: 800;
      background: var(--ig-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-google-login {
      margin-top: 10px;
      width: 100%;
      padding: 12px 18px;
      background: #ffffff;
      color: #000000;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.2s;
    }
    .btn-google-login:active { opacity: 0.85; }

    /* ─── 搜尋輸入框組件 ─── */
    .search-pill-box {
      background: rgba(28, 28, 30, 0.95);
      border: 1px solid var(--ig-border);
      border-radius: 28px;
      padding: 6px 8px 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .search-input-field {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13.5px;
      outline: none;
    }
    .search-input-field::placeholder { color: var(--ig-text-sub); }

    .user-avatar-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--ig-gradient);
      padding: 2px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
    }

    .user-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 15px;
    }
    .user-avatar-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    /* 🔍 搜尋提示下拉選單 (Autocomplete) */
    .search-suggestions-dropdown {
      position: absolute;
      top: 46px;
      left: 0;
      right: 0;
      background: rgba(24, 24, 27, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--ig-border);
      border-radius: 16px;
      max-height: 240px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.9);
      z-index: 3000;
    }
    .search-suggestions-dropdown.active { display: flex; }

    .suggestion-item {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:active, .suggestion-item:hover { background: rgba(255, 255, 255, 0.08); }
    .suggestion-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
    .suggestion-name { font-size: 13.5px; font-weight: 700; color: #fff; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .suggestion-sub { font-size: 11px; color: var(--ig-text-sub); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .suggestion-badge { font-size: 10px; padding: 2px 6px; border-radius: 8px; background: #000; color: #a1a1aa; border: 1px solid #333; flex-shrink: 0; }

    /* ─── IG Stories 限動風格分類圈 ─── */
    .ig-stories-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
      padding: 4px 2px;
      flex-shrink: 0;
    }
    .ig-stories-container::-webkit-scrollbar { display: none; }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      flex-shrink: 0;
      user-select: none;
    }

    .story-ring {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #2c2c2e;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .story-item:active .story-ring { transform: scale(0.92); }

    .story-item.active .story-ring {
      background: var(--ig-gradient);
      box-shadow: 0 0 10px var(--ig-gradient-glow);
    }

    .story-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #000;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      overflow: hidden;
    }
    .story-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .story-label {
      font-size: 11px;
      color: var(--ig-text-sub);
      font-weight: 500;
    }
    .story-item.active .story-label {
      color: #fff;
      font-weight: 700;
    }

    /* ─── IG Profile 個人檔案卡 (電腦端) ─── */
    .ig-profile-card {
      background: var(--ig-surface);
      border: 1px solid var(--ig-border);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .ig-stats-row {
      display: flex;
      justify-content: space-around;
      text-align: center;
    }
    .ig-stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .ig-stat-num {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }
    .ig-stat-label {
      font-size: 10px;
      color: var(--ig-text-sub);
    }

    .ig-progress-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .ig-rank-line {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }
    .ig-bar-bg {
      width: 100%;
      height: 4px;
      background: #000;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--ig-border);
    }
    .ig-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--ig-gradient);
      transition: width 0.4s ease;
    }

    /* ─── 右上角圓形圖層按鈕 ─── */
    .fab-layer-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(18, 18, 18, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--ig-border);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      z-index: 1100;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s;
    }
    .fab-layer-btn:active { transform: scale(0.92); }

    .layer-picker-menu {
      position: absolute;
      background: rgba(18, 18, 18, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--ig-border);
      border-radius: 16px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 1200;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      width: 140px;
    }
    .layer-picker-menu.active { display: flex; }

    .layer-option-btn {
      background: transparent;
      border: none;
      color: var(--ig-text-sub);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .layer-option-btn.active, .layer-option-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    /* ─── 地圖 ─── */
    #map {
      flex: 1;
      height: 100%;
      width: 100%;
      background: #09090b;
      z-index: 1;
    }

    /* ─── 側邊欄 (電腦) / 底部抽屜 (手機) ─── */
    #sidebar {
      background: var(--ig-bg);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* 電腦端頂部 Header */
    .sidebar-desktop-header {
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--ig-border);
      flex-shrink: 0;
    }
    .desktop-brand {
      font-size: 16px;
      font-weight: 800;
      background: var(--ig-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .desktop-action-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .btn-icon {
      background: var(--ig-surface);
      border: 1px solid var(--ig-border);
      color: var(--ig-text-main);
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .btn-icon:hover { background: var(--ig-card-hover); }

    /* 手機端頂部拉桿區 */
    .sheet-header-touch-zone {
      width: 100%;
      height: 64px;
      padding: 8px 16px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: grab;
      touch-action: none;
      user-select: none;
      flex-shrink: 0;
      box-sizing: border-box;
      background: rgba(18, 18, 18, 0.98);
    }

    .sheet-handle-pill {
      width: 44px;
      height: 5px;
      background: #52525b;
      border-radius: 999px;
      margin: 0 auto;
    }

    .sheet-peek-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }
    .peek-title {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .peek-stats {
      font-size: 12px;
      color: var(--ig-text-sub);
      font-weight: 600;
    }

    /* 手機端工具按鈕列 */
    .actions-bar {
      padding: 8px 14px;
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--ig-border);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .btn-action-pill {
      background: var(--ig-surface);
      border: 1px solid var(--ig-border);
      color: var(--ig-text-main);
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    /* 快捷新增區塊 */
    .quick-add-wrap {
      padding: 6px 14px 2px;
      flex-shrink: 0;
    }
    .quick-add-box {
      padding: 6px 10px;
      background: var(--ig-surface);
      border-radius: 12px;
      border: 1px solid var(--ig-border);
      display: flex;
      gap: 6px;
    }
    .quick-input {
      flex: 1;
      background: #000;
      border: 1px solid var(--ig-border);
      border-radius: 8px;
      padding: 6px 10px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }
    .btn-quick-add {
      background: var(--ig-blue);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    /* 店家列表容器 */
    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 6px 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
      min-height: 0;
    }

    .store-card {
      background: var(--ig-card);
      border: 1px solid var(--ig-border);
      border-radius: 14px;
      padding: 10px 12px;
      position: relative;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .store-card.is-unlocked {
      border: 1px solid rgba(220, 39, 67, 0.45);
      background: linear-gradient(135deg, rgba(220, 39, 67, 0.12), var(--ig-card));
    }
    .store-card.highlight-card {
      border: 1.5px solid var(--ig-blue) !important;
      background: rgba(0, 149, 246, 0.15) !important;
    }

    .heart-burst {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 10;
      animation: igHeartBurst 0.75s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes igHeartBurst {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      45% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }
    .store-title-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .drag-handle {
      color: #71717a;
      font-size: 14px;
      cursor: grab;
      padding: 2px 4px;
      touch-action: none;
    }
    .store-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
    }
    .badge-status {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 700;
    }
    .badge-locked { background: #18181b; color: #a1a1aa; }
    .badge-unlocked { background: var(--ig-gradient); color: #fff; }

    .store-address {
      font-size: 11px;
      color: var(--ig-text-sub);
      margin-bottom: 6px;
      padding-left: 18px;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 6px;
      padding-left: 18px;
    }
    .tag-pill {
      background: #000;
      color: #a1a1aa;
      font-size: 9.5px;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid #333;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-heart {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 17px;
      display: flex;
      align-items: center;
      padding: 2px;
    }
    .card-edit-btn {
      background: transparent;
      border: 1px solid var(--ig-border);
      color: var(--ig-text-sub);
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* ─── 地標 Marker ─── */
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s ease;
    }
    .marker-unlocked {
      background: var(--ig-gradient);
      box-shadow: 0 0 12px var(--ig-gradient-glow);
      padding: 2px;
    }
    .marker-unlocked-inner {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .marker-locked {
      background: #27272a;
      border: 1.5px solid #3f3f46;
      opacity: 0.9;
    }

    /* 遠景極簡微型點樣式 */
    .marker-dot-unlocked {
      background: var(--ig-gradient);
      box-shadow: 0 0 8px var(--ig-gradient-glow);
      border-radius: 50%;
      border: 1px solid #fff;
    }
    .marker-dot-locked {
      background: #71717a;
      border-radius: 50%;
      opacity: 0.55;
    }

    .leaflet-popup-content-wrapper {
      background: var(--ig-card) !important;
      color: #fff !important;
      border: 1px solid var(--ig-border);
      border-radius: 14px;
    }
    .leaflet-popup-tip { background: var(--ig-card) !important; }

    .popup-container {
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 220px;
    }
    .popup-title { font-size: 13.5px; font-weight: 700; color: #fff; }
    .popup-address { font-size: 11px; color: var(--ig-text-sub); }
    .popup-btn-row { display: flex; gap: 4px; margin-top: 4px; }
    .btn-toggle {
      flex: 1;
      padding: 5px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    .btn-toggle.unlock { background: var(--ig-gradient); color: #fff; }
    .btn-toggle.relock { background: #18181b; color: #e4e4e7; }

    /* ─── 👤 IG 風格帳號選單 Action Sheet ─── */
    .ig-user-sheet {
      background: var(--ig-surface);
      border: 1px solid var(--ig-border);
      border-radius: 20px;
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.95);
      animation: igSheetPop 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.2);
    }
    @keyframes igSheetPop {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .ig-user-sheet-header {
      padding: 24px 20px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--ig-border);
      text-align: center;
    }

    .ig-sheet-avatar-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--ig-gradient);
      padding: 2.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--ig-gradient-glow);
    }

    .ig-sheet-avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #000;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 26px;
    }
    .ig-sheet-avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .ig-user-sheet-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }
    .ig-user-sheet-name {
      font-size: 15.5px;
      font-weight: 800;
      color: #fff;

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      doc, 
      writeBatch, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // ──────────────────────────────────────────
    // 🛡️ 授權白名單
    // ──────────────────────────────────────────
    const ALLOWED_EMAILS = [
      "tp6u4jo6@gmail.com",
    ];

    const firebaseConfig = {

    };

    let db = null;
    let auth = null;
    let googleProvider = null;
    let storesCollection = null;
    let isFirebaseReady = false;
    let currentUser = null;
    let unsubscribeFirestore = null;
    let sortableInstance = null;

    if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
        googleProvider = new GoogleAuthProvider();
        storesCollection = collection(db, "vegan_stores");
        isFirebaseReady = true;

        onAuthStateChanged(auth, async (user) => {
          const lockScreen = document.getElementById('auth-lock-screen');
          const avatarSyncEls = document.querySelectorAll('.user-avatar-sync');

          if (user) {
            if (!ALLOWED_EMAILS.includes(user.email)) {
              alert(`⛔ 存取被拒絕！\n\n帳號【${user.email}】不在授權白名單中。`);
              currentUser = null;
              await signOut(auth);
              lockScreen.style.display = 'flex';
              return;
            }

            currentUser = user;
            lockScreen.style.display = 'none';

            avatarSyncEls.forEach(el => {
              if (user.photoURL) {
                el.innerHTML = `<img src="${user.photoURL}" alt="avatar" />`;
              } else {
                el.innerText = '👤';
              }
            });

            document.getElementById('menu-user-name').innerText = user.displayName || '蔬食探索者';
            document.getElementById('menu-user-email').innerText = user.email;

            if (!unsubscribeFirestore) {
              unsubscribeFirestore = onSnapshot(storesCollection, (snapshot) => {
                stores = snapshot.docs.map(d => ({
                  id: d.id,
                  ...d.data()
                })).sort((a, b) => (a.order ?? 999999) - (b.order ?? 999999));
                refreshAll();
              }, (err) => {
                console.error("Firestore 錯誤:", err);
              });
            }

            setTimeout(() => map.invalidateSize(), 200);

          } else {
            currentUser = null;
            lockScreen.style.display = 'flex';
            stores = [];
            if (unsubscribeFirestore) {
              unsubscribeFirestore();
              unsubscribeFirestore = null;
            }
            refreshAll();
          }
        });

      } catch (err) {
        console.warn("Firebase 初始化失敗", err);
      }
    }

    let stores = [];

    // 初始化地圖
    const map = L.map('map', { center: [24.805, 120.975], zoom: 13, zoomControl: false });

    // 多風格底圖定義
    const layers = {
      taiwan: L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', { maxZoom: 19 }),
      dark: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }),
      osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
      satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 })
    };

    // 🇹🇼 預設使用臺灣通用地圖
    let currentBaseLayer = layers.taiwan;
    currentBaseLayer.addTo(map);

    window.toggleLayerMenu = function() {
      document.getElementById('layer-picker-menu').classList.toggle('active');
    };

    window.switchBaseLayer = function(type, el) {
      if (layers[type]) {
        map.removeLayer(currentBaseLayer);
        currentBaseLayer = layers[type];
        currentBaseLayer.addTo(map);

        document.querySelectorAll('.layer-option-btn').forEach(btn => btn.classList.remove('active'));
        if (el) el.classList.add('active');
        document.getElementById('layer-picker-menu').classList.remove('active');
      }
    };

    const constellationLayer = L.layerGroup().addTo(map);
    const markersLayer = L.layerGroup().addTo(map);
    const markersRef = {};

    function calculateRank(visitedCount, total) {
      if (total === 0 || visitedCount === 0) return '🌱 蔬食初探者';
      const pct = Math.round((visitedCount / total) * 100);
      if (pct === 100) return '👑 蔬食星域主宰';
      if (pct >= 80 || visitedCount >= 15) return '🌟 蔬食星圖領航星';
      if (pct >= 60 || visitedCount >= 10) return '✨ 綠光導航員';
      if (pct >= 40 || visitedCount >= 6) return '🍃 植感生活達人';
      if (pct >= 20 || visitedCount >= 3) return '🌿 巷弄綠食行者';
      return '🌱 蔬食初探者';
    }

    /* ─── 取得分類對應圖示 ─── */
    function getCategoryIcon(category) {
      if (!category) return '🌱';
      if (category.includes('蛋奶素')) return '🍳';
      if (category.includes('純素') || category.includes('全素')) return '🌱';
      if (category.includes('早午餐')) return '🥪';
      if (category.includes('甜點')) return '🍰';
      if (category.includes('異國')) return '🍕';
      return '🌱';
    }

    /* ─── 🎯 視圖精確居中計算 ─── */
    window.flyToWithOffset = function(lat, lng, zoom = 16.5) {
      if (window.innerWidth <= 768) {
        const topBarHeight = 135;
        const bottomSheetHeight = window.innerHeight * 0.42;
        const visibleCenterY = topBarHeight + (window.innerHeight - topBarHeight - bottomSheetHeight) / 2;
        const screenCenterY = window.innerHeight / 2;
        const offsetY = visibleCenterY - screenCenterY;

        const targetPoint = map.project([lat, lng], zoom);
        const offsetPoint = L.point(targetPoint.x, targetPoint.y - offsetY);
        const targetLatLng = map.unproject(offsetPoint, zoom);
        map.flyTo(targetLatLng, zoom, { duration: 0.6 });
      } else {
        map.flyTo([lat, lng], zoom, { duration: 0.6 });
      }
    };

    /* ─── 📱 手機端跟手抽屜引擎 ─── */
    const sidebar = document.getElementById('sidebar');
    const headerTouchZone = document.getElementById('sheet-header-zone');
    let sheetState = 'collapsed';
    let isDragging = false;
    let startY = 0;
    let startHeight = 0;
    let hasMoved = false;

    window.setMobileSheetState = function(state) {
      sidebar.classList.remove('is-dragging');
      sidebar.style.height = '';
      sidebar.classList.remove('sheet-collapsed', 'sheet-half', 'sheet-full');
      sidebar.classList.add(`sheet-${state}`);
      sheetState = state;
      setTimeout(() => map.invalidateSize(), 300);
    };

    headerTouchZone.addEventListener('touchstart', (e) => {
      if (window.innerWidth > 768) return;
      isDragging = true;
      hasMoved = false;
      startY = e.touches[0].clientY;
      startHeight = sidebar.getBoundingClientRect().height;
      sidebar.classList.add('is-dragging');
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || window.innerWidth > 768) return;
      const currentY = e.touches[0].clientY;
      const deltaY = startY - currentY;
      if (Math.abs(deltaY) > 4) hasMoved = true;
      const targetH = Math.max(64, Math.min(window.innerHeight * 0.96, startHeight + deltaY));
      sidebar.style.height = `${targetH}px`;
    }, { passive: true });

    window.addEventListener('touchend', () => {
      if (!isDragging || window.innerWidth > 768) return;
      isDragging = false;
      sidebar.classList.remove('is-dragging');

      if (!hasMoved) {
        if (sheetState === 'collapsed') setMobileSheetState('half');
        else if (sheetState === 'half') setMobileSheetState('full');
        else setMobileSheetState('collapsed');
        return;
      }

      const finalH = sidebar.getBoundingClientRect().height;
      const winH = window.innerHeight;

      if (finalH < winH * 0.20) setMobileSheetState('collapsed');
      else if (finalH < winH * 0.60) setMobileSheetState('half');
      else setMobileSheetState('full');
    });

    map.on('click', () => {
      document.getElementById('layer-picker-menu').classList.remove('active');
      document.querySelectorAll('.search-suggestions-dropdown').forEach(d => d.classList.remove('active'));
      if (window.innerWidth <= 768 && sheetState !== 'collapsed') {
        setMobileSheetState('collapsed');
      }
    });

    /* ─── 🔍 搜尋自動補全提示（Google Maps 風格：僅提供搜尋跳轉，不硬性過濾地圖與清單） ─── */
    window.handleSearchSync = function(val) {
      const kw = val.trim().toLowerCase();
      
      document.querySelectorAll('.search-input-field').forEach(input => {
        if (input.value !== val) input.value = val;
      });

      const dropdowns = [
        document.getElementById('search-suggestions-desktop'),
        document.getElementById('search-suggestions-mobile')
      ];

      if (!kw) {
        dropdowns.forEach(d => { if (d) { d.classList.remove('active'); d.innerHTML = ''; } });
        return;
      }

      // 從所有店家尋找符合關鍵字的項目
      const matches = stores.filter(s => 
        s.name.toLowerCase().includes(kw) || 
        (s.address && s.address.toLowerCase().includes(kw)) ||
        (s.category && s.category.toLowerCase().includes(kw))
      );

      if (matches.length > 0) {
        const html = matches.slice(0, 5).map(s => `
          <div class="suggestion-item" onclick="selectStoreFromSearch('${s.id}')">
            <div class="suggestion-info">
              <span class="suggestion-name">${s.name}</span>
              <span class="suggestion-sub">📍 ${s.address || '地區店家'}</span>
            </div>
            <span class="suggestion-badge">${s.category || '蔬食'}</span>
          </div>
        `).join('');
        dropdowns.forEach(d => { if (d) { d.innerHTML = html; d.classList.add('active'); } });
      } else {
        dropdowns.forEach(d => { if (d) { d.classList.remove('active'); d.innerHTML = ''; } });
      }
    };

    document.querySelectorAll('.search-input-field').forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const kw = input.value.trim().toLowerCase();
          if (!kw) return;
          const matched = stores.find(s => 
            s.name.toLowerCase().includes(kw) || 
            (s.address && s.address.toLowerCase().includes(kw))
          );
          if (matched) selectStoreFromSearch(matched.id);
        }
      });
    });

    window.selectStoreFromSearch = function(id) {
      const store = stores.find(s => s.id === id);
      if (!store) return;

      document.querySelectorAll('.search-input-field').forEach(input => input.value = store.name);
      document.querySelectorAll('.search-suggestions-dropdown').forEach(d => d.classList.remove('active'));
      document.querySelectorAll('.search-input-field').forEach(input => input.blur());

      if (window.innerWidth <= 768) setMobileSheetState('half');

      flyToWithOffset(store.lat, store.lng, 16.5);
      const marker = markersRef[id];
      if (marker) setTimeout(() => marker.openPopup(), 400);

      setTimeout(() => {
        const card = document.querySelector(`.store-card[data-id="${id}"]`);
        if (card) {
          document.querySelectorAll('.store-card').forEach(c => c.classList.remove('highlight-card'));
          card.classList.add('highlight-card');
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }, 300);
    };

    /* ─── 👤 帳號選單控制 ─── */
    window.openUserMenu = function() {
      document.getElementById('user-menu-modal').classList.add('active');

    window.closeUserMenu = function() {

    window.confirmLogout = async function() {

    window.handleAuth = async function() {
      if (!isFirebaseReady) return alert('請先填入正確的 firebaseConfig！');
      try {

      } catch (err) {

    /* ─── 標籤篩選 (同步電腦與手機 Stories 狀態) ─── */
    let currentCategory = 'all';
    let statusFilter = 'all'; // 可選值: 'all' | 'visited' | 'unvisited'

    window.setCategoryFilter = function(cat) {
      currentCategory = cat;
      
      document.querySelectorAll('.story-item').forEach(item => {
        const label = item.querySelector('.story-label')?.innerText.trim();
        if (label === (cat === 'all' ? '全部' : cat)) {
          item.classList.add('active');

    window.toggleStatusFilter = function(type) {
      if (statusFilter === type) {
        statusFilter = 'all';
      } else {
        statusFilter = type;
      }

      const visitedRings = [document.getElementById('desktop-status-ring-visited'), document.getElementById('mobile-status-ring-visited')];
      const unvisitedRings = [document.getElementById('desktop-status-ring-unvisited'), document.getElementById('mobile-status-ring-unvisited')];

      visitedRings.forEach(ring => {

      unvisitedRings.forEach(ring => {

    };

    /* ─── 核心篩選輔助函式（僅依標籤與打卡狀態篩選） ─── */
    function getFilteredStores() {
      return stores.filter(s => {
        const matchCategory = (currentCategory === 'all') || (s.category && s.category.includes(currentCategory));
        
        let matchStatus = true;
        if (statusFilter === 'visited') matchStatus = s.visited;
        if (statusFilter === 'unvisited') matchStatus = !s.visited;

        return matchCategory && matchStatus;
      });
    }

    /* ─── 經緯度解析與快速新增 ─── */
    async function reverseGeocode(lat, lng) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
        const data = await res.json();
        if (data && data.address) {
          const addr = data.address;
          return `${addr.city || addr.county || ''}${addr.suburb || addr.district || ''}${addr.road || ''}${addr.house_number ? addr.house_number + '號' : ''}`;
        }
      } catch (e) {}
      return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }

    window.handleQuickAdd = async function() {
      if (!currentUser) return alert('請先登入！');
      const input = document.getElementById('gmaps-input').value.trim();
      if (!input) return;

      const btn = document.getElementById('btn-quick-submit');
      btn.innerText = '...';
      btn.disabled = true;

      let lat = 24.805, lng = 120.975;
      let detectedName = '';
      let address = '';

      if (input.includes('google.com/maps') || input.includes('goo.gl')) {
        const nameMatch = input.match(/\/place\/([^\/@?]+)/);
        if (nameMatch && nameMatch[1]) {
          try {
            detectedName = decodeURIComponent(nameMatch[1].replace(/\+/g, ' '));
          } catch (e) {
            detectedName = nameMatch[1];
          }
        }

        const preciseMatch = input.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
        const atMatch = input.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);

        if (preciseMatch) {
          lat = parseFloat(preciseMatch[1]);
          lng = parseFloat(preciseMatch[2]);
        } else if (atMatch) {
          lat = parseFloat(atMatch[1]);
          lng = parseFloat(atMatch[2]);
        }

        address = await reverseGeocode(lat, lng);
      } else {
        const coordMatch = input.match(/(-?\d+\.\d+)\s*[,，\s]\s*(-?\d+\.\d+)/);
        if (coordMatch) {
          lat = parseFloat(coordMatch[1]);
          lng = parseFloat(coordMatch[2]);
          address = await reverseGeocode(lat, lng);
        } else {
          address = input;
        }
      }

      const finalName = prompt('📍 請確認店家名稱：', detectedName || '新蔬食店家');
      btn.innerText = '新增';
      btn.disabled = false;

      if (finalName) {
        await addDoc(storesCollection, {
          name: finalName.trim(),
          address: address || '',
          category: '蛋奶素',
          visited: false,
          lat,
          lng,
          order: stores.length,
          createdAt: serverTimestamp ? serverTimestamp() : Date.now()
        });
        document.getElementById('gmaps-input').value = '';
      }
    };

    /* ─── 🪐 星軌連線（聚落星系網） ─── */
    function renderConstellation(filteredStores) {
      constellationLayer.clearLayers();
      const visited = filteredStores.filter(s => s.visited);
      if (visited.length < 2) return;

      const zoom = map.getZoom();
      
      let maxDist = 1200;
      if (zoom >= 16) maxDist = 2000;
      else if (zoom >= 14) maxDist = 1400;
      else if (zoom <= 12) maxDist = 600;

      const connectedPairs = new Set();

      visited.forEach((p1, i) => {
        const neighbors = [];
        visited.forEach((p2, j) => {
          if (i !== j) {
            const dist = L.latLng(p1.lat, p1.lng).distanceTo(L.latLng(p2.lat, p2.lng));
            if (dist <= maxDist) {
              neighbors.push({ p2, j, dist });
            }
          }
        });

        neighbors.sort((a, b) => a.dist - b.dist);
        const closest = neighbors.slice(0, 2);

        closest.forEach(({ p2, j }) => {
          const pairKey = i < j ? `${i}-${j}` : `${j}-${i}`;
          if (!connectedPairs.has(pairKey)) {
            connectedPairs.add(pairKey);
            const latlngs = [[p1.lat, p1.lng], [p2.lat, p2.lng]];
            L.polyline(latlngs, { color: '#dc2743', weight: zoom >= 14 ? 3 : 1.8, opacity: 0.35, lineJoin: 'round' }).addTo(constellationLayer);
            L.polyline(latlngs, { color: '#f09433', weight: zoom >= 14 ? 1.5 : 0.8, dashArray: '4, 5', opacity: 0.9 }).addTo(constellationLayer);
          }
        });
      });
    }

    /* ─── 📍 地標同步篩選（遠看極簡微型點 + 解鎖高亮） ─── */
    function renderMarkers(filteredStores) {
      markersLayer.clearLayers();
      for (const id in markersRef) delete markersRef[id];

      const zoom = map.getZoom();
      const isDense = zoom < 14;

      filteredStores.forEach(s => {
        let size, iconHtml;

        if (isDense) {
          if (s.visited) {
            size = 12;
            iconHtml = `<div class="marker-dot-unlocked" style="width:${size}px; height:${size}px;"></div>`;
          } else {
            size = 5;
            iconHtml = `<div class="marker-dot-locked" style="width:${size}px; height:${size}px;"></div>`;
          }
        } else {
          size = s.visited ? 28 : 20;
          const fontSize = s.visited ? 13 : 10;
          const iconChar = getCategoryIcon(s.category);

          iconHtml = `
            <div class="custom-marker ${s.visited ? 'marker-unlocked' : 'marker-locked'}" 
                 style="width:${size}px; height:${size}px; font-size:${fontSize}px;">
              <div class="${s.visited ? 'marker-unlocked-inner' : ''}">
                ${iconChar}
              </div>
            </div>
          `;
        }

        const marker = L.marker([s.lat, s.lng], {
          icon: L.divIcon({ html: iconHtml, className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2] })
        }).addTo(markersLayer);
        markersRef[s.id] = marker;

        marker.bindPopup(`
          <div class="popup-container">
            <div class="popup-title">${s.name}</div>
            <div class="popup-address">📍 ${s.address || '無地址'}</div>
            <div class="popup-btn-row">
              <button class="btn-toggle ${s.visited ? 'relock' : 'unlock'}" onclick="toggleVisited('${s.id}')">
                ${s.visited ? '取消打卡' : '❤️ 點亮打卡'}
              </button>
              <button class="card-edit-btn" onclick="openEditModal('${s.id}')">✏️</button>
              <button class="card-edit-btn" style="color:#ff453a;" onclick="deleteStore('${s.id}')">🗑️</button>
            </div>
          </div>
        `, {
          autoPan: true,
          autoPanPaddingTopLeft: [20, 140],
          autoPanPaddingBottomRight: [20, window.innerHeight * 0.42]
        });
      });
    }

    // 地圖縮放時動態重新計算地標與星軌大小
    map.on('zoomend', () => {
      const filtered = getFilteredStores();
      renderConstellation(filtered);
      renderMarkers(filtered);
    });

    function updateSidebar(filteredStores) {
      const listEl = document.getElementById('restaurant-list');
      listEl.innerHTML = '';

      const total = stores.length;
      const visitedCount = stores.filter(s => s.visited).length;
      const pct = total > 0 ? Math.round((visitedCount / total) * 100) : 0;

      // 📱 手機端摘要
      document.getElementById('peek-stats-text').innerText = `已收錄 ${total} ｜ 打卡 ${visitedCount}`;

      // 💻 電腦端 IG Profile 數據
      const desktopTotal = document.getElementById('desktop-stat-total');
      const desktopVisited = document.getElementById('desktop-stat-visited');
      const desktopPct = document.getElementById('desktop-stat-pct');
      const desktopRank = document.getElementById('desktop-rank-name');
      const desktopRatio = document.getElementById('desktop-stat-ratio');
      const desktopBar = document.getElementById('desktop-progress-bar');

      if (desktopTotal && desktopVisited && desktopPct) {
        desktopTotal.innerText = total;
        desktopVisited.innerText = visitedCount;
        desktopPct.innerText = `${pct}%`;
        desktopRank.innerText = calculateRank(visitedCount, total);
        desktopRatio.innerText = `${visitedCount} / ${total}`;

      }

      if (filteredStores.length === 0) {

        return;
      }

      filteredStores.forEach((s) => {
        const card = document.createElement('div');
        card.className = `store-card ${s.visited ? 'is-unlocked' : ''}`;
        card.setAttribute('data-id', s.id);

          const burst = document.createElement('div');
          burst.className = 'heart-burst';
          burst.innerHTML = `<span style="font-size: 46px;">❤️</span>`;
          card.appendChild(burst);
          setTimeout(() => burst.remove(), 750);
        });

        card.innerHTML = `
          <div class="card-top">
            <div class="store-title-group">
              <span class="drag-handle" title="按住拖曳">⋮⋮</span>
              <span class="store-title">${s.name}</span>
            </div>
            <span class="badge-status ${s.visited ? 'badge-unlocked' : 'badge-locked'}">
              ${s.visited ? '❤️ 已打卡' : '待造訪'}
            </span>
          </div>
          <div class="store-address">📍 ${s.address || `${s.lat.toFixed(4)}, ${s.lng.toFixed(4)}`}</div>
          <div class="card-bottom">
            <span class="tag-pill">${s.category || '蔬食'}</span>
            <div class="card-actions">
              <button class="btn-heart" title="${s.visited ? '取消打卡' : '點亮愛心'}" onclick="event.stopPropagation(); toggleVisited('${s.id}')">
                ${s.visited ? '❤️' : '🤍'}
              </button>
              <button class="card-edit-btn" onclick="event.stopPropagation(); openEditModal('${s.id}')">✏️ 編輯</button>
            </div>
          </div>
        `;
        card.onclick = () => focusStore(s.id);
        listEl.appendChild(card);
      });

      if (sortableInstance) sortableInstance.destroy();
      const isCustomSortAllowed = currentCategory === 'all' && statusFilter === 'all';

      sortableInstance = new Sortable(listEl, {
        animation: 180,
        handle: '.drag-handle',
        disabled: !isCustomSortAllowed,
        onEnd: async function () {
          const itemEls = Array.from(listEl.querySelectorAll('.store-card'));
          const newOrderIds = itemEls.map(el => el.getAttribute('data-id'));

          stores.sort((a, b) => newOrderIds.indexOf(a.id) - newOrderIds.indexOf(b.id));

          if (isFirebaseReady && currentUser) {
            const batch = writeBatch(db);
            stores.forEach((s, idx) => {
              s.order = idx;
              batch.update(doc(db, "vegan_stores", s.id), { order: idx });
            });
            await batch.commit();
          }
          renderConstellation(getFilteredStores());
        }
      });
    }

    window.focusStore = function(id) {

    };

    window.deleteStore = async function(id) {
      if (!currentUser) return alert('請先登入！');
      if (confirm('確定要刪除這間店家嗎？')) {
        await deleteDoc(doc(db, "vegan_stores", id));
      }
    };

    window.clearAllStores = async function() {
      if (!currentUser) return alert('請先登入！');
      if (confirm('⚠️ 確定要清空所有店家名單嗎？')) {
        const batch = writeBatch(db);
        stores.forEach(s => batch.delete(doc(db, "vegan_stores", s.id)));
        await batch.commit();
      }
    };

    map.on('click', async (e) => {
      if (!currentUser) return alert('請先登入！');
      document.getElementById('form-id').value = '';
      document.getElementById('form-name').value = '';
      document.getElementById('form-category').value = '蛋奶素';
      document.getElementById('form-lat').value = e.latlng.lat;
      document.getElementById('form-lng').value = e.latlng.lng;
      document.getElementById('form-address').value = '取得地址中...';
      document.getElementById('form-visited').value = 'false';
      document.getElementById('modal').classList.add('active');

      const addr = await reverseGeocode(e.latlng.lat, e.latlng.lng);
      document.getElementById('form-address').value = addr;
    });

    window.openEditModal = function(id) {
      if (!currentUser) return alert('請先登入！');
      const store = stores.find(s => s.id === id);
      if (!store) return;

      document.getElementById('modal-title').innerText = '✏️ 編輯貼文資訊';
      document.getElementById('form-id').value = store.id;
      document.getElementById('form-name').value = store.name;
      document.getElementById('form-address').value = store.address || '';
      document.getElementById('form-category').value = store.category || '蛋奶素';
      document.getElementById('form-lat').value = store.lat;
      document.getElementById('form-lng').value = store.lng;
      document.getElementById('form-visited').value = store.visited ? 'true' : 'false';
      map.closePopup();
      document.getElementById('modal').classList.add('active');
    };

    window.closeModal = function() {
      document.getElementById('modal').classList.remove('active');
    };

    window.saveFormStore = async function() {
      if (!currentUser) return alert('請先登入！');
      const editId = document.getElementById('form-id').value;
      const name = document.getElementById('form-name').value.trim();
      let address = document.getElementById('form-address').value.trim();
      const category = document.getElementById('form-category').value.trim() || '蛋奶素';
      const visited = document.getElementById('form-visited').value === 'true';
      let lat = parseFloat(document.getElementById('form-lat').value) || 24.805;
      let lng = parseFloat(document.getElementById('form-lng').value) || 120.975;

      if (!name) return alert('請輸入店名！');

      // 檢查輸入框內是否有經緯度並自動更新座標
      const coordMatch = address.match(/(-?\d+\.\d+)\s*[,，\s]\s*(-?\d+\.\d+)/);
      if (coordMatch) {
        lat = parseFloat(coordMatch[1]);
        lng = parseFloat(coordMatch[2]);
        const realAddr = await reverseGeocode(lat, lng);
        if (realAddr) address = realAddr;
      }

      const payload = { name, address, category, visited, lat, lng };

      if (editId) {
        await updateDoc(doc(db, "vegan_stores", editId), payload);
      } else {
        payload.order = stores.length;
        payload.createdAt = serverTimestamp ? serverTimestamp() : Date.now();
        await addDoc(storesCollection, payload);
      }

      closeModal();
    };

    window.exportData = function() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stores, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `vegan_map_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    window.importData = async function(event) {
      if (!currentUser) return alert('請先登入授權帳號！');
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            const batch = writeBatch(db);
            imported.forEach((item, index) => {
              const newDocRef = doc(storesCollection);
              batch.set(newDocRef, {
                name: item.name || '未命名',
                address: item.address || '',
                category: item.category || '蛋奶素',
                visited: Boolean(item.visited),
                lat: typeof item.lat === 'number' ? item.lat : parseFloat(item.lat) || 24.805,
                lng: typeof item.lng === 'number' ? item.lng : parseFloat(item.lng) || 120.975,
                order: typeof item.order === 'number' ? item.order : index,
                createdAt: Date.now()
              });
            });
            await batch.commit();
            alert(`✅ 成功匯入 ${imported.length} 筆店家！`);
          }
        } catch (err) {
          alert('匯入失敗：格式不正確。');
        }
        event.target.value = '';
      };
      reader.readAsText(file, 'UTF-8');
    };

    function refreshAll() {
      const filtered = getFilteredStores();
      renderConstellation(filtered);
      renderMarkers(filtered);
      updateSidebar(filtered);
    }

    refreshAll();
  </script>
</body>
</html>
