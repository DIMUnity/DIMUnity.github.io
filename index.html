<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>蔬食探索星圖</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <style>
    :root {
      --ig-bg: #000000;
      --ig-panel: #18181b;
      --ig-card: #27272a;
      --ig-card-hover: #323238;
      --ig-border: #333338;
      --ig-border-light: #44444c;
      --ig-text-main: #f4f4f5;
      --ig-text-sub: #a1a1aa;
      --ig-blue: #0095f6;
      --ig-blue-hover: #1877f2;
      --ig-heart: #ff3040;
      --ig-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --ig-gradient-glow: rgba(220, 39, 67, 0.45);
      --sidebar-width: 390px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      background: var(--ig-bg);
      color: var(--ig-text-main);
      position: relative;
    }

    /* ─── 登入攔截鎖定頁面 ─── */
    #auth-lock-screen {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .lock-card {
      background: var(--ig-panel);
      border: 1px solid var(--ig-border);
      padding: 36px 24px;
      border-radius: 24px;
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
    }

    .lock-logo-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--ig-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      box-shadow: 0 0 20px var(--ig-gradient-glow);
    }

    .lock-logo-inner {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .lock-title {
      font-size: 20px;
      font-weight: 800;
      background: var(--ig-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-google-login {
      margin-top: 10px;
      width: 100%;
      padding: 12px 18px;
      background: #ffffff;
      color: #000000;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s;
    }
    .btn-google-login:active { transform: scale(0.98); }

    /* ─── 搜尋與分類模組 ─── */
    .search-filter-module {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: absolute;
      box-sizing: border-box;
      pointer-events: none;
    }

    .search-pill-box {
      pointer-events: auto;
      background: rgba(24, 24, 27, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--ig-border);
      border-radius: 28px;
      padding: 6px 8px 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.7);
    }

    .search-input-field {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13.5px;
      outline: none;
    }
    .search-input-field::placeholder { color: var(--ig-text-sub); }

    .user-avatar-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--ig-gradient);
      padding: 2px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
    }

    .user-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #18181b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 15px;
    }
    .user-avatar-img img { width: 100%; height: 100%; object-fit: cover; }

    /* 🔍 搜尋提示下拉選單 (Autocomplete) */
    .search-suggestions-dropdown {
      pointer-events: auto;
      position: absolute;
      top: 48px;
      left: 0;
      right: 0;
      background: rgba(24, 24, 27, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--ig-border);
      border-radius: 18px;
      max-height: 260px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.9);
      z-index: 2500;
    }
    .search-suggestions-dropdown.active { display: flex; }

    .suggestion-item {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:active, .suggestion-item:hover { background: rgba(255, 255, 255, 0.1); }
    .suggestion-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
    .suggestion-name { font-size: 13.5px; font-weight: 700; color: #fff; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .suggestion-sub { font-size: 11px; color: var(--ig-text-sub); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .suggestion-badge { font-size: 10px; padding: 2px 6px; border-radius: 8px; background: #000; color: #a1a1aa; border: 1px solid #333; flex-shrink: 0; }

    /* 水平滑動分類膠囊 */
    .top-chips-scroll {
      pointer-events: auto;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }
    .top-chips-scroll::-webkit-scrollbar { display: none; }

    .chip-pill {
      background: rgba(24, 24, 27, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--ig-border);
      color: var(--ig-text-sub);
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .chip-pill.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    /* ─── 右上角圓形圖層按鈕 ─── */
    .fab-layer-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(24, 24, 27, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--ig-border);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      z-index: 1100;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s;
    }
    .fab-layer-btn:active { transform: scale(0.92); }

    .layer-picker-menu {
      position: absolute;
      top: 68px;
      right: 16px;
      background: rgba(24, 24, 27, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--ig-border);
      border-radius: 16px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 1200;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      width: 140px;
    }
    .layer-picker-menu.active { display: flex; }

    .layer-option-btn {
      background: transparent;
      border: none;
      color: var(--ig-text-sub);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .layer-option-btn.active, .layer-option-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    /* ─── 地圖 ─── */
    #map {
      flex: 1;
      height: 100%;
      width: 100%;
      background: #09090b;
      z-index: 1;
    }

    /* ─── 側邊欄 (電腦) / 底部抽屜 (手機) ─── */
    #sidebar {
      background: var(--ig-bg);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .sidebar-desktop-header {
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--ig-border);
      flex-shrink: 0;
    }
    .desktop-brand {
      font-size: 16px;
      font-weight: 800;
      background: var(--ig-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sheet-header-touch-zone {
      width: 100%;
      height: 64px;
      padding: 8px 16px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: grab;
      touch-action: none;
      user-select: none;
      flex-shrink: 0;
      box-sizing: border-box;
      background: rgba(24, 24, 27, 0.98);
    }

    .sheet-handle-pill {
      width: 44px;
      height: 5px;
      background: #52525b;
      border-radius: 999px;
      margin: 0 auto;
    }

    .sheet-peek-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }
    .peek-title {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .peek-stats {
      font-size: 12px;
      color: var(--ig-text-sub);
      font-weight: 600;
    }

    .actions-bar {
      padding: 8px 14px;
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--ig-border);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .btn-action-pill {
      background: var(--ig-panel);
      border: 1px solid var(--ig-border);
      color: var(--ig-text-main);
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .quick-add-box {
      margin: 8px 14px 4px;
      padding: 6px 10px;
      background: var(--ig-panel);
      border-radius: 12px;
      border: 1px solid var(--ig-border);
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .quick-input {
      flex: 1;
      background: #000;
      border: 1px solid var(--ig-border);
      border-radius: 8px;
      padding: 6px 10px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }
    .btn-quick-add {
      background: var(--ig-blue);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 6px 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
      min-height: 0;
    }

    .store-card {
      background: var(--ig-card);
      border: 1px solid var(--ig-border);
      border-radius: 14px;
      padding: 10px 12px;
      position: relative;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .store-card.is-unlocked {
      border: 1px solid rgba(220, 39, 67, 0.4);
      background: linear-gradient(135deg, rgba(220, 39, 67, 0.1), var(--ig-card));
    }
    .store-card.highlight-card {
      border: 1.5px solid var(--ig-blue) !important;
      background: rgba(0, 149, 246, 0.12) !important;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }
    .store-title-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .drag-handle {
      color: #71717a;
      font-size: 14px;
      cursor: grab;
      padding: 2px 4px;
      touch-action: none;
    }
    .store-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
    }
    .badge-status {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 700;
    }
    .badge-locked { background: #18181b; color: #a1a1aa; }
    .badge-unlocked { background: var(--ig-gradient); color: #fff; }

    .store-address {
      font-size: 11px;
      color: var(--ig-text-sub);
      margin-bottom: 6px;
      padding-left: 18px;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 6px;
      padding-left: 18px;
    }
    .tag-pill {
      background: #000;
      color: #a1a1aa;
      font-size: 9.5px;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid #333;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-heart {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    .card-edit-btn {
      background: transparent;
      border: 1px solid var(--ig-border);
      color: var(--ig-text-sub);
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* 地標 Marker */
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .marker-unlocked {
      background: var(--ig-gradient);
      box-shadow: 0 0 12px var(--ig-gradient-glow);
      padding: 2px;
    }
    .marker-unlocked-inner {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .marker-locked {
      background: #27272a;
      border: 1.5px solid #3f3f46;
      opacity: 0.9;
    }

    .leaflet-popup-content-wrapper {
      background: var(--ig-card) !important;
      color: #fff !important;
      border: 1px solid var(--ig-border);
      border-radius: 14px;
    }
    .leaflet-popup-tip { background: var(--ig-card) !important; }

    .popup-container {
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 220px;
    }
    .popup-title { font-size: 13.5px; font-weight: 700; color: #fff; }
    .popup-address { font-size: 11px; color: var(--ig-text-sub); }
    .popup-btn-row { display: flex; gap: 4px; margin-top: 4px; }
    .btn-toggle {
      flex: 1;
      padding: 5px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    .btn-toggle.unlock { background: var(--ig-gradient); color: #fff; }
    .btn-toggle.relock { background: #18181b; color: #e4e4e7; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--ig-panel);
      border: 1px solid var(--ig-border);
      padding: 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; color: var(--ig-text-sub); font-weight: 600; }
    .form-control {
      background: #000;
      border: 1px solid var(--ig-border);
      padding: 8px 10px;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .btn-secondary { background: #27272a; color: #fff; padding: 6px 12px; border: none; border-radius: 8px; font-size: 12px; }
    .btn-primary { background: var(--ig-blue); color: #fff; font-weight: 700; padding: 6px 14px; border: none; border-radius: 8px; font-size: 12px; }

    /* ═════════════════════════════════════════════
       💻 電腦端佈局 (> 768px)：標準雙欄，搜尋整合至側欄
       ═════════════════════════════════════════════ */
    @media (min-width: 769px) {
      body { flex-direction: row; }
      
      #sidebar {
        width: var(--sidebar-width);
        height: 100%;
        border-right: 1px solid var(--ig-border);
        z-index: 1000;
      }

      .sheet-header-touch-zone { display: none; }

      /* 電腦端將搜尋與分類精準置於側欄頂部 */
      .search-filter-module {
        position: absolute;
        top: 54px;
        left: 14px;
        width: 362px;
        z-index: 1200;
      }

      /* 在側欄清單上方墊出等高間距，避免被搜尋與分類膠囊遮擋 */
      .sidebar-search-spacer {
        height: 84px;
        flex-shrink: 0;
      }

      .fab-layer-btn {
        top: 16px;
        right: 16px;
      }
    }

    /* ═════════════════════════════════════════════
       📱 手機端 Google Maps 抽屜佈局 (<= 768px)
       ═════════════════════════════════════════════ */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      
      #map {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }

      .sidebar-desktop-header,
      .sidebar-search-spacer {
        display: none !important;
      }

      /* 手機端搜尋列浮動於地圖上方 */
      .search-filter-module {
        position: fixed;
        top: 14px;
        left: 14px;
        right: 14px;
        z-index: 1500;
      }

      .fab-layer-btn {
        top: 108px;
        right: 14px;
      }
      .layer-picker-menu {
        top: 160px;
        right: 14px;
      }

      #sidebar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        background: rgba(24, 24, 27, 0.96);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid #3f3f46;
        border-radius: 24px 24px 0 0;
        box-shadow: 0 -8px 36px rgba(0, 0, 0, 0.95);
        z-index: 2000;
        transition: height 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      }

      #sidebar.is-dragging {
        transition: none !important;
      }

      #sidebar.sheet-collapsed { height: 64px; }
      #sidebar.sheet-half { height: 35vh; }
      #sidebar.sheet-full { height: 96vh; }
    }
  </style>
</head>
<body>

  <!-- 全螢幕登入鎖定畫面 -->
  <div id="auth-lock-screen">
    <div class="lock-card">
      <div class="lock-logo-ring"><div class="lock-logo-inner">🌱</div></div>
      <div>
        <h2 class="lock-title">蔬食探索星圖</h2>
        <p style="font-size: 13px; color: var(--ig-text-sub); margin-top: 6px;">🔒 本星圖僅限受邀授權帳號訪問</p>
      </div>
      <button class="btn-google-login" onclick="handleAuth()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        使用 Google 授權帳號登入
      </button>
    </div>
  </div>

  <!-- 搜尋與分類模組 -->
  <div class="search-filter-module">
    <div class="search-pill-box">
      <span style="font-size: 15px;">🔍</span>
      <input type="text" id="search-box" class="search-input-field" placeholder="搜尋蔬食、地址、標籤..." autocomplete="off" />
      <button class="user-avatar-btn" onclick="handleAuth()" title="點擊登出 / 切換帳號">
        <div class="user-avatar-img" id="user-avatar">🌱</div>
      </button>
    </div>

    <!-- 🔍 搜尋提示下拉選單 (Autocomplete) -->
    <div class="search-suggestions-dropdown" id="search-suggestions"></div>

    <!-- 標籤分類水平滾動 -->
    <div class="top-chips-scroll">
      <span class="chip-pill active" onclick="setCategoryFilter('all', this)">✨ 全部</span>
      <span class="chip-pill" onclick="setCategoryFilter('純素', this)">🌱 純素</span>
      <span class="chip-pill" onclick="setCategoryFilter('蛋奶素', this)">🍳 蛋奶素</span>
      <span class="chip-pill" onclick="setCategoryFilter('早午餐', this)">🥪 早午餐</span>
      <span class="chip-pill" onclick="setCategoryFilter('甜點', this)">🍰 甜點</span>
      <span class="chip-pill" onclick="setCategoryFilter('異國', this)">🍕 異國料理</span>
      <span class="chip-pill" onclick="toggleStatusFilter(this)">❤️ 只看已打卡</span>
      <div style="min-width: 8px; height: 1px; flex-shrink: 0;"></div>
    </div>
  </div>

  <!-- 側邊欄 (電腦) / 底部抽屜 (手機) -->
  <div id="sidebar" class="sheet-collapsed">
    
    <!-- 電腦端專屬頂部標題列 -->
    <div class="sidebar-desktop-header">
      <div class="desktop-brand">🌱 蔬食探索星圖</div>
      <div style="font-size: 11px; color: var(--ig-text-sub);" id="desktop-stats-text">0 家收錄</div>
    </div>

    <!-- 電腦端墊高間距（避開絕對定位的搜尋欄） -->
    <div class="sidebar-search-spacer"></div>

    <!-- 手機端頂部拉桿區 (64px) -->
    <div class="sheet-header-touch-zone" id="sheet-header-zone">
      <div class="sheet-handle-pill"></div>
      <div class="sheet-peek-summary">
        <div class="peek-title">
          <span>🌱 蔬食探索星圖</span>
        </div>
        <div class="peek-stats" id="peek-stats-text">已收錄 0 ｜ 打卡 0</div>
      </div>
    </div>

    <!-- 工具按鈕列 -->
    <div class="actions-bar">
      <button class="btn-action-pill" onclick="document.getElementById('import-file').click()">📥 匯入 JSON</button>
      <input type="file" id="import-file" style="display:none" onchange="importData(event)" accept=".json" />
      <button class="btn-action-pill" onclick="exportData()">📤 匯出備份</button>
      <button class="btn-action-pill" onclick="clearAllStores()">🗑️ 清空名單</button>
    </div>

    <!-- 快捷新增區塊 -->
    <div class="quick-add-box">
      <input type="text" id="gmaps-input" class="quick-input" placeholder="貼上經緯度、地址或 Google 地圖連結..." />
      <button class="btn-quick-add" id="btn-quick-submit" onclick="handleQuickAdd()">新增</button>
    </div>

    <!-- 店家清單列表 -->
    <div class="list-container" id="restaurant-list"></div>
  </div>

  <!-- 右上角圓形圖層切換按鈕 -->
  <button class="fab-layer-btn" onclick="toggleLayerMenu()" title="切換地圖風格">🗺️</button>

  <!-- 圖層選擇浮動選單 (預設臺灣通用) -->
  <div class="layer-picker-menu" id="layer-picker-menu">
    <button class="layer-option-btn active" onclick="switchBaseLayer('taiwan', this)">🇹🇼 臺灣通用</button>
    <button class="layer-option-btn" onclick="switchBaseLayer('dark', this)">🌑 極簡暗黑</button>
    <button class="layer-option-btn" onclick="switchBaseLayer('osm', this)">🗺️ 開源街景</button>
    <button class="layer-option-btn" onclick="switchBaseLayer('satellite', this)">🛰️ 衛星空照</button>
  </div>

  <!-- 地圖本體 -->
  <div id="map"></div>

  <!-- 新增 / 編輯彈窗 Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div id="modal-title" style="font-size: 15px; font-weight: 800; color: #fff;">📍 新增蔬食店家</div>
      <input type="hidden" id="form-id" />
      <input type="hidden" id="form-lat" />
      <input type="hidden" id="form-lng" />

      <div class="form-group">
        <label>餐廳名稱 *</label>
        <input type="text" id="form-name" class="form-control" placeholder="請輸入店名" />
      </div>

      <div class="form-group">
        <label>詳細地址或位置</label>
        <input type="text" id="form-address" class="form-control" placeholder="輸入中文地址" />
      </div>

      <div class="form-group">
        <label>分類 / 標籤</label>
        <input type="text" id="form-category" class="form-control" value="蛋奶素" />
      </div>

      <div class="form-group">
        <label>打卡狀態</label>
        <select id="form-visited" class="form-control">
          <option value="false">🔖 未造訪 (收藏清單)</option>
          <option value="true">❤️ 已打卡 (點亮星圖)</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn-primary" id="btn-save" onclick="saveFormStore()">儲存</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase 與核心邏輯模組 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      doc, 
      writeBatch, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // ──────────────────────────────────────────
    // 🛡️ 授權白名單
    // ──────────────────────────────────────────
    const ALLOWED_EMAILS = [
      "tp6u4jo6@gmail.com",
    ];

    const firebaseConfig = {
      apiKey: "AIzaSyCI9IfeQEa37kdx5ZSqtFvpsm9z3oa9n-Y",
      authDomain: "hsinchu-veg-map.firebaseapp.com",
      projectId: "hsinchu-veg-map",
      storageBucket: "hsinchu-veg-map.firebasestorage.app",
      messagingSenderId: "229294662793",
      appId: "1:229294662793:web:d467459c29f46eb0aed258"
    };

    let db = null;
    let auth = null;
    let googleProvider = null;
    let storesCollection = null;
    let isFirebaseReady = false;
    let currentUser = null;
    let unsubscribeFirestore = null;
    let sortableInstance = null;

    if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
        googleProvider = new GoogleAuthProvider();
        storesCollection = collection(db, "vegan_stores");
        isFirebaseReady = true;

        onAuthStateChanged(auth, async (user) => {
          const lockScreen = document.getElementById('auth-lock-screen');
          const avatarEl = document.getElementById('user-avatar');

          if (user) {
            if (!ALLOWED_EMAILS.includes(user.email)) {
              alert(`⛔ 存取被拒絕！\n\n帳號【${user.email}】不在授權白名單中。`);
              currentUser = null;
              await signOut(auth);
              lockScreen.style.display = 'flex';
              return;
            }

            currentUser = user;
            lockScreen.style.display = 'none';

            if (user.photoURL) {
              avatarEl.innerHTML = `<img src="${user.photoURL}" alt="avatar" />`;
            } else {
              avatarEl.innerText = '👤';
            }

            if (!unsubscribeFirestore) {
              unsubscribeFirestore = onSnapshot(storesCollection, (snapshot) => {
                stores = snapshot.docs.map(d => ({
                  id: d.id,
                  ...d.data()
                })).sort((a, b) => (a.order ?? 999999) - (b.order ?? 999999));
                refreshAll();
              }, (err) => {
                console.error("Firestore 錯誤:", err);
              });
            }

            setTimeout(() => map.invalidateSize(), 200);

          } else {
            currentUser = null;
            lockScreen.style.display = 'flex';
            stores = [];
            if (unsubscribeFirestore) {
              unsubscribeFirestore();
              unsubscribeFirestore = null;
            }
            refreshAll();
          }
        });

      } catch (err) {
        console.warn("Firebase 初始化失敗", err);
      }
    }

    let stores = [];

    // 初始化地圖
    const map = L.map('map', { center: [24.805, 120.975], zoom: 13, zoomControl: false });

    // 多風格底圖定義
    const layers = {
      taiwan: L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', { maxZoom: 19 }),
      dark: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }),
      osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }),
      satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 })
    };

    // 🇹🇼 預設使用臺灣通用地圖
    let currentBaseLayer = layers.taiwan;
    currentBaseLayer.addTo(map);

    window.toggleLayerMenu = function() {
      document.getElementById('layer-picker-menu').classList.toggle('active');
    };

    window.switchBaseLayer = function(type, el) {
      if (layers[type]) {
        map.removeLayer(currentBaseLayer);
        currentBaseLayer = layers[type];
        currentBaseLayer.addTo(map);

        document.querySelectorAll('.layer-option-btn').forEach(btn => btn.classList.remove('active'));
        if (el) el.classList.add('active');
        document.getElementById('layer-picker-menu').classList.remove('active');
      }
    };

    const constellationLayer = L.layerGroup().addTo(map);
    const markersLayer = L.layerGroup().addTo(map);
    const markersRef = {};

    /* ─── 🎯 視圖精確居中計算 ─── */
    window.flyToWithOffset = function(lat, lng, zoom = 16.5) {
      if (window.innerWidth <= 768) {
        const topBarHeight = 115;
        const bottomSheetHeight = window.innerHeight * 0.35;
        const visibleCenterY = topBarHeight + (window.innerHeight - topBarHeight - bottomSheetHeight) / 2;
        const screenCenterY = window.innerHeight / 2;
        const offsetY = visibleCenterY - screenCenterY;

        const targetPoint = map.project([lat, lng], zoom);
        const offsetPoint = L.point(targetPoint.x, targetPoint.y - offsetY);
        const targetLatLng = map.unproject(offsetPoint, zoom);
        map.flyTo(targetLatLng, zoom, { duration: 0.6 });
      } else {
        map.flyTo([lat, lng], zoom, { duration: 0.6 });
      }
    };

    /* ─── 📱 手機端跟手抽屜引擎 ─── */
    const sidebar = document.getElementById('sidebar');
    const headerTouchZone = document.getElementById('sheet-header-zone');
    let sheetState = 'collapsed';
    let isDragging = false;
    let startY = 0;
    let startHeight = 0;
    let hasMoved = false;

    window.setMobileSheetState = function(state) {
      sidebar.classList.remove('is-dragging');
      sidebar.style.height = '';
      sidebar.classList.remove('sheet-collapsed', 'sheet-half', 'sheet-full');
      sidebar.classList.add(`sheet-${state}`);
      sheetState = state;
      setTimeout(() => map.invalidateSize(), 300);
    };

    headerTouchZone.addEventListener('touchstart', (e) => {
      if (window.innerWidth > 768) return;
      isDragging = true;
      hasMoved = false;
      startY = e.touches[0].clientY;
      startHeight = sidebar.getBoundingClientRect().height;
      sidebar.classList.add('is-dragging');
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || window.innerWidth > 768) return;
      const currentY = e.touches[0].clientY;
      const deltaY = startY - currentY;
      if (Math.abs(deltaY) > 4) hasMoved = true;
      const targetH = Math.max(64, Math.min(window.innerHeight * 0.96, startHeight + deltaY));
      sidebar.style.height = `${targetH}px`;
    }, { passive: true });

    window.addEventListener('touchend', () => {
      if (!isDragging || window.innerWidth > 768) return;
      isDragging = false;
      sidebar.classList.remove('is-dragging');

      if (!hasMoved) {
        if (sheetState === 'collapsed') setMobileSheetState('half');
        else if (sheetState === 'half') setMobileSheetState('full');
        else setMobileSheetState('collapsed');
        return;
      }

      const finalH = sidebar.getBoundingClientRect().height;
      const winH = window.innerHeight;

      if (finalH < winH * 0.20) setMobileSheetState('collapsed');
      else if (finalH < winH * 0.60) setMobileSheetState('half');
      else setMobileSheetState('full');
    });

    map.on('click', () => {
      document.getElementById('layer-picker-menu').classList.remove('active');
      document.getElementById('search-suggestions').classList.remove('active');
      if (window.innerWidth <= 768 && sheetState !== 'collapsed') {
        setMobileSheetState('collapsed');
      }
    });

    /* ─── 🔍 搜尋自動補全提示 (Autocomplete) 與 Enter 聚焦 ─── */
    const searchBox = document.getElementById('search-box');
    const suggestionsDropdown = document.getElementById('search-suggestions');

    searchBox.addEventListener('input', (e) => {
      const val = e.target.value.trim().toLowerCase();
      searchKeyword = val;
      updateSidebar();

      if (!val) {
        suggestionsDropdown.classList.remove('active');
        suggestionsDropdown.innerHTML = '';
        return;
      }

      const matches = stores.filter(s => 
        s.name.toLowerCase().includes(val) || 
        (s.address && s.address.toLowerCase().includes(val)) ||
        (s.category && s.category.toLowerCase().includes(val))
      );

      if (matches.length > 0) {
        suggestionsDropdown.innerHTML = matches.slice(0, 5).map(s => `
          <div class="suggestion-item" onclick="selectStoreFromSearch('${s.id}')">
            <div class="suggestion-info">
              <span class="suggestion-name">${s.name}</span>
              <span class="suggestion-sub">📍 ${s.address || '地區店家'}</span>
            </div>
            <span class="suggestion-badge">${s.category || '蔬食'}</span>
          </div>
        `).join('');
        suggestionsDropdown.classList.add('active');
      } else {
        suggestionsDropdown.classList.remove('active');
        suggestionsDropdown.innerHTML = '';
      }
    });

    searchBox.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = searchBox.value.trim().toLowerCase();
        if (!val) return;
        const matched = stores.find(s => 
          s.name.toLowerCase().includes(val) || 
          (s.address && s.address.toLowerCase().includes(val))
        );
        if (matched) selectStoreFromSearch(matched.id);
      }
    });

    window.selectStoreFromSearch = function(id) {
      const store = stores.find(s => s.id === id);
      if (!store) return;

      searchBox.value = store.name;
      suggestionsDropdown.classList.remove('active');
      searchBox.blur();

      if (window.innerWidth <= 768) setMobileSheetState('half');

      flyToWithOffset(store.lat, store.lng, 16.5);
      const marker = markersRef[id];
      if (marker) setTimeout(() => marker.openPopup(), 400);

      setTimeout(() => {
        const card = document.querySelector(`.store-card[data-id="${id}"]`);
        if (card) {
          document.querySelectorAll('.store-card').forEach(c => c.classList.remove('highlight-card'));
          card.classList.add('highlight-card');
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 300);
    };

    /* ─── 登入 / 登出 ─── */
    window.handleAuth = async function() {
      if (!isFirebaseReady) return alert('請先填入正確的 firebaseConfig！');
      if (currentUser) {
        if (confirm(`目前登入：${currentUser.displayName || currentUser.email}\n確定要登出嗎？`)) {
          await signOut(auth);
        }
      } else {
        try {
          await signInWithPopup(auth, googleProvider);
        } catch (err) {
          alert(`登入失敗：${err.message}`);
        }
      }
    };

    /* ─── 標籤篩選 ─── */
    let currentCategory = 'all';
    let filterVisitedOnly = false;
    let searchKeyword = '';

    window.setCategoryFilter = function(cat, el) {
      currentCategory = cat;
      document.querySelectorAll('.chip-pill').forEach(p => {
        if (p !== el && !p.innerText.includes('只看已打卡')) p.classList.remove('active');
      });
      if (el) el.classList.add('active');
      updateSidebar();
      if (window.innerWidth <= 768 && sheetState === 'collapsed') setMobileSheetState('half');
    };

    window.toggleStatusFilter = function(el) {
      filterVisitedOnly = !filterVisitedOnly;
      el.classList.toggle('active', filterVisitedOnly);
      updateSidebar();
    };

    /* ─── 經緯度解析與快速新增 ─── */
    async function reverseGeocode(lat, lng) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
        const data = await res.json();
        if (data && data.address) {
          const addr = data.address;
          return `${addr.city || addr.county || ''}${addr.suburb || addr.district || ''}${addr.road || ''}${addr.house_number ? addr.house_number + '號' : ''}`;
        }
      } catch (e) {}
      return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }

    window.handleQuickAdd = async function() {
      if (!currentUser) return alert('請先登入！');
      const input = document.getElementById('gmaps-input').value.trim();
      if (!input) return;

      const btn = document.getElementById('btn-quick-submit');
      btn.innerText = '...';
      btn.disabled = true;

      let lat = 24.805, lng = 120.975, address = input;
      const coordMatch = input.match(/(-?\d+\.\d+)\s*[,，\s]\s*(-?\d+\.\d+)/);
      if (coordMatch) {
        lat = parseFloat(coordMatch[1]);
        lng = parseFloat(coordMatch[2]);
        address = await reverseGeocode(lat, lng);
      }

      const name = prompt('📍 請輸入店家名稱：', '新蔬食店家');
      btn.innerText = '新增';
      btn.disabled = false;

      if (name) {
        await addDoc(storesCollection, {
          name: name.trim(),
          address: address || '',
          category: '蛋奶素',
          visited: false,
          lat,
          lng,
          order: stores.length,
          createdAt: serverTimestamp ? serverTimestamp() : Date.now()
        });
        document.getElementById('gmaps-input').value = '';
      }
    };

    function renderConstellation() {
      constellationLayer.clearLayers();
      const visitedStores = stores.filter(s => s.visited);
      if (visitedStores.length >= 2) {
        const latlngs = visitedStores.map(s => [s.lat, s.lng]);
        L.polyline(latlngs, { color: '#dc2743', weight: 5, opacity: 0.35, lineJoin: 'round' }).addTo(constellationLayer);
        L.polyline(latlngs, { color: '#f09433', weight: 2, dashArray: '6, 6', opacity: 0.9 }).addTo(constellationLayer);
      }
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      stores.forEach(s => {
        const iconHtml = `
          <div class="custom-marker ${s.visited ? 'marker-unlocked' : 'marker-locked'}" 
               style="width:${s.visited ? '26px' : '18px'}; height:${s.visited ? '26px' : '18px'}; font-size:10px;">
            <div class="${s.visited ? 'marker-unlocked-inner' : ''}">
              ${s.visited ? '❤️' : '🌱'}
            </div>
          </div>
        `;
        const marker = L.marker([s.lat, s.lng], {
          icon: L.divIcon({ html: iconHtml, className: '', iconSize: [26, 26], iconAnchor: [13, 13] })
        }).addTo(markersLayer);
        markersRef[s.id] = marker;

        marker.bindPopup(`
          <div class="popup-container">
            <div class="popup-title">${s.name}</div>
            <div class="popup-address">📍 ${s.address || '無地址'}</div>
            <div class="popup-btn-row">
              <button class="btn-toggle ${s.visited ? 'relock' : 'unlock'}" onclick="toggleVisited('${s.id}')">
                ${s.visited ? '取消打卡' : '❤️ 點亮打卡'}
              </button>
              <button class="card-edit-btn" onclick="openEditModal('${s.id}')">✏️</button>
              <button class="card-edit-btn" style="color:#ff453a;" onclick="deleteStore('${s.id}')">🗑️</button>
            </div>
          </div>
        `, {
          autoPan: true,
          autoPanPaddingTopLeft: [20, 120],
          autoPanPaddingBottomRight: [20, window.innerHeight * 0.36]
        });
      });
    }

    function updateSidebar() {
      const listEl = document.getElementById('restaurant-list');
      listEl.innerHTML = '';

      const total = stores.length;
      const visitedCount = stores.filter(s => s.visited).length;
      document.getElementById('peek-stats-text').innerText = `已收錄 ${total} ｜ 打卡 ${visitedCount}`;
      const desktopStats = document.getElementById('desktop-stats-text');
      if (desktopStats) desktopStats.innerText = `已收錄 ${total} ｜ 打卡 ${visitedCount}`;

      const filtered = stores.filter(s => {
        const matchCategory = (currentCategory === 'all') || (s.category && s.category.includes(currentCategory));
        const matchVisited = !filterVisitedOnly || s.visited;
        const matchSearch = s.name.toLowerCase().includes(searchKeyword) || 
                            (s.address && s.address.toLowerCase().includes(searchKeyword));
        return matchCategory && matchVisited && matchSearch;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; padding:30px; color:var(--ig-text-sub); font-size:12px;">無符合店家</div>`;
        return;
      }

      filtered.forEach((s) => {
        const card = document.createElement('div');
        card.className = `store-card ${s.visited ? 'is-unlocked' : ''}`;
        card.setAttribute('data-id', s.id);

        card.innerHTML = `
          <div class="card-top">
            <div class="store-title-group">
              <span class="drag-handle" title="按住拖曳">⋮⋮</span>
              <span class="store-title">${s.name}</span>
            </div>
            <span class="badge-status ${s.visited ? 'badge-unlocked' : 'badge-locked'}">
              ${s.visited ? '❤️ 已打卡' : '待造訪'}
            </span>
          </div>
          <div class="store-address">📍 ${s.address || `${s.lat.toFixed(4)}, ${s.lng.toFixed(4)}`}</div>
          <div class="card-bottom">
            <span class="tag-pill">${s.category || '蔬食'}</span>
            <div class="card-actions">
              <button class="btn-heart" onclick="event.stopPropagation(); toggleVisited('${s.id}')">
                ${s.visited ? '❤️' : '🤍'}
              </button>
              <button class="card-edit-btn" onclick="event.stopPropagation(); openEditModal('${s.id}')">✏️ 編輯</button>
            </div>
          </div>
        `;
        card.onclick = () => focusStore(s.id);
        listEl.appendChild(card);
      });

      if (sortableInstance) sortableInstance.destroy();
      const isCustomSortAllowed = currentCategory === 'all' && !filterVisitedOnly && searchKeyword === '';

      sortableInstance = new Sortable(listEl, {
        animation: 180,
        handle: '.drag-handle',
        disabled: !isCustomSortAllowed,
        onEnd: async function () {
          const itemEls = Array.from(listEl.querySelectorAll('.store-card'));
          const newOrderIds = itemEls.map(el => el.getAttribute('data-id'));

          stores.sort((a, b) => newOrderIds.indexOf(a.id) - newOrderIds.indexOf(b.id));

          if (isFirebaseReady && currentUser) {
            const batch = writeBatch(db);
            stores.forEach((s, idx) => {
              s.order = idx;
              batch.update(doc(db, "vegan_stores", s.id), { order: idx });
            });
            await batch.commit();
          }
          renderConstellation();
        }
      });
    }

    window.focusStore = function(id) {
      const store = stores.find(s => s.id === id);
      if (store) {
        if (window.innerWidth <= 768) setMobileSheetState('half');
        flyToWithOffset(store.lat, store.lng, 16.5);
        const marker = markersRef[id];
        if (marker) setTimeout(() => marker.openPopup(), 300);
      }
    };

    window.toggleVisited = async function(id) {
      if (!currentUser) return alert('請先登入！');
      const target = stores.find(s => s.id === id);
      if (target) {
        await updateDoc(doc(db, "vegan_stores", id), { visited: !target.visited });
        map.closePopup();
      }
    };

    window.deleteStore = async function(id) {
      if (!currentUser) return alert('請先登入！');
      if (confirm('確定要刪除這間店家嗎？')) {
        await deleteDoc(doc(db, "vegan_stores", id));
      }
    };

    window.clearAllStores = async function() {
      if (!currentUser) return alert('請先登入！');
      if (confirm('⚠️ 確定要清空所有店家名單嗎？')) {
        const batch = writeBatch(db);
        stores.forEach(s => batch.delete(doc(db, "vegan_stores", s.id)));
        await batch.commit();
      }
    };

    map.on('click', async (e) => {
      if (!currentUser) return alert('請先登入！');
      document.getElementById('form-id').value = '';
      document.getElementById('form-name').value = '';
      document.getElementById('form-category').value = '蛋奶素';
      document.getElementById('form-lat').value = e.latlng.lat;
      document.getElementById('form-lng').value = e.latlng.lng;
      document.getElementById('form-address').value = '取得地址中...';
      document.getElementById('form-visited').value = 'false';
      document.getElementById('modal').classList.add('active');

      const addr = await reverseGeocode(e.latlng.lat, e.latlng.lng);
      document.getElementById('form-address').value = addr;
    });

    window.openEditModal = function(id) {
      if (!currentUser) return alert('請先登入！');
      const store = stores.find(s => s.id === id);
      if (!store) return;

      document.getElementById('modal-title').innerText = '✏️ 編輯貼文資訊';
      document.getElementById('form-id').value = store.id;
      document.getElementById('form-name').value = store.name;
      document.getElementById('form-address').value = store.address || '';
      document.getElementById('form-category').value = store.category || '蛋奶素';
      document.getElementById('form-lat').value = store.lat;
      document.getElementById('form-lng').value = store.lng;
      document.getElementById('form-visited').value = store.visited ? 'true' : 'false';
      map.closePopup();
      document.getElementById('modal').classList.add('active');
    };

    window.closeModal = function() {
      document.getElementById('modal').classList.remove('active');
    };

    window.saveFormStore = async function() {
      if (!currentUser) return alert('請先登入！');
      const editId = document.getElementById('form-id').value;
      const name = document.getElementById('form-name').value.trim();
      const address = document.getElementById('form-address').value.trim();
      const category = document.getElementById('form-category').value.trim() || '蛋奶素';
      const visited = document.getElementById('form-visited').value === 'true';
      const lat = parseFloat(document.getElementById('form-lat').value) || 24.805;
      const lng = parseFloat(document.getElementById('form-lng').value) || 120.975;

      if (!name) return alert('請輸入店名！');

      const payload = { name, address, category, visited, lat, lng };

      if (editId) {
        await updateDoc(doc(db, "vegan_stores", editId), payload);
      } else {
        payload.order = stores.length;
        payload.createdAt = serverTimestamp ? serverTimestamp() : Date.now();
        await addDoc(storesCollection, payload);
      }

      closeModal();
    };

    window.exportData = function() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stores, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `vegan_map_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    window.importData = async function(event) {
      if (!currentUser) return alert('請先登入授權帳號！');
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            const batch = writeBatch(db);
            imported.forEach((item, index) => {
              const newDocRef = doc(storesCollection);
              batch.set(newDocRef, {
                name: item.name || '未命名',
                address: item.address || '',
                category: item.category || '蛋奶素',
                visited: Boolean(item.visited),
                lat: typeof item.lat === 'number' ? item.lat : parseFloat(item.lat) || 24.805,
                lng: typeof item.lng === 'number' ? item.lng : parseFloat(item.lng) || 120.975,
                order: typeof item.order === 'number' ? item.order : index,
                createdAt: Date.now()
              });
            });
            await batch.commit();
            alert(`✅ 成功匯入 ${imported.length} 筆店家！`);
          }
        } catch (err) {
          alert('匯入失敗：格式不正確。');
        }
        event.target.value = '';
      };
      reader.readAsText(file, 'UTF-8');
    };

    function refreshAll() {
      renderConstellation();
      renderMarkers();
      updateSidebar();
    }

    refreshAll();
  </script>
</body>
</html>
