<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>蔬食探索星圖</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --ig-bg: #000000;
      --ig-panel: #121212;
      --ig-card: #1c1c1e;
      --ig-card-hover: #26262a;
      --ig-border: #262626;
      --ig-border-light: #363636;
      --ig-text-main: #f5f5f7;
      --ig-text-sub: #a8a8a8;
      --ig-blue: #0095f6;
      --ig-blue-hover: #1877f2;
      --ig-heart: #ff3040;
      --ig-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --ig-gradient-glow: rgba(220, 39, 67, 0.45);
      --sidebar-width: 400px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      background: var(--ig-bg);
      color: var(--ig-text-main);
      position: relative;
    }

    /* ─── 登入攔截鎖定頁面 ─── */
    #auth-lock-screen {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .lock-card {
      background: var(--ig-panel);
      border: 1px solid var(--ig-border);
      padding: 36px 24px;
      border-radius: 20px;
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
    }

    .lock-logo-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--ig-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      box-shadow: 0 0 20px var(--ig-gradient-glow);
    }

    .lock-logo-inner {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .lock-title {
      font-size: 19px;
      font-weight: 800;
      background: var(--ig-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lock-subtitle {
      font-size: 13px;
      color: var(--ig-text-sub);
      line-height: 1.5;
    }

    .btn-google-login {
      margin-top: 10px;
      width: 100%;
      padding: 12px 18px;
      background: #ffffff;
      color: #000000;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    /* ─── 側邊欄 ─── */
    #sidebar {
      width: var(--sidebar-width);
      height: 100%;
      background: var(--ig-bg);
      border-right: 1px solid var(--ig-border);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.9);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      flex-shrink: 0;
    }

    #sidebar.collapsed {
      transform: translateX(-100%);
    }

    .sidebar-toggle-btn {
      position: absolute;
      right: -28px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 60px;
      background: var(--ig-panel);
      border: 1px solid var(--ig-border);
      border-left: none;
      border-radius: 0 12px 12px 0;
      color: var(--ig-text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      box-shadow: 4px 2px 14px rgba(0, 0, 0, 0.7);
      z-index: 1001;
    }

    .sidebar-header {
      padding: 12px 16px;
      background: var(--ig-bg);
      border-bottom: 1px solid var(--ig-border);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      background: var(--ig-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-icon {
      background: var(--ig-panel);
      border: 1px solid var(--ig-border);
      color: var(--ig-text-main);
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--ig-card-hover);
      border-color: #555;
    }

    /* ─── IG Stories ─── */
    .stories-bar {
      display: flex;
      gap: 12px;
      padding: 10px 14px;
      overflow-x: auto;
      border-bottom: 1px solid var(--ig-border);
      background: var(--ig-bg);
      scrollbar-width: none;
    }
    .stories-bar::-webkit-scrollbar { display: none; }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex-shrink: 0;
      user-select: none;
    }

    .story-ring-sm {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--ig-border-light);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .story-item.active .story-ring-sm {
      background: var(--ig-gradient);
      box-shadow: 0 0 10px var(--ig-gradient-glow);
    }

    .story-avatar-sm {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #000;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .story-title {
      font-size: 10px;
      color: var(--ig-text-sub);
      font-weight: 500;
    }
    .story-item.active .story-title {
      color: #fff;
      font-weight: 700;
    }

    /* ─── 快捷新增區塊 ─── */
    .quick-add-box {
      margin: 8px 14px 0;
      padding: 10px 12px;
      background: var(--ig-panel);
      border-radius: 12px;
      border: 1px solid var(--ig-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .quick-add-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--ig-text-sub);
      letter-spacing: 0.5px;
    }

    .quick-input-row {
      display: flex;
      gap: 6px;
    }

    .quick-input {
      flex: 1;
      background: #000;
      border: 1px solid var(--ig-border);
      border-radius: 8px;
      padding: 7px 10px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    .btn-quick-add {
      background: var(--ig-blue);
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ─── IG Profile 檔案卡 ─── */
    .profile-card {
      margin: 8px 14px 0;
      padding: 10px 12px;
      background: var(--ig-panel);
      border-radius: 12px;
      border: 1px solid var(--ig-border);
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .story-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--ig-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      flex-shrink: 0;
    }

    .story-avatar-inner {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 50%;
      border: 2px solid var(--ig-panel);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      overflow: hidden;
    }

    .story-avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-stats {
      flex: 1;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-num {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .stat-label {
      font-size: 10px;
      color: var(--ig-text-sub);
    }

    .profile-bio {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--ig-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rank-name {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }

    .progress-bar-bg {
      background: #000;
      height: 4px;
      border-radius: 999px;
      margin-top: 6px;
      overflow: hidden;
      border: 1px solid var(--ig-border);
    }

    .progress-bar-fill {
      background: var(--ig-gradient);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    .controls-section {
      padding: 8px 14px 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .search-input {
      width: 100%;
      padding: 7px 12px;
      background: #000;
      border: 1px solid var(--ig-border);
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .pill {
      font-size: 11px;
      padding: 4px 10px;
      background: var(--ig-panel);
      color: var(--ig-text-sub);
      border: 1px solid var(--ig-border);
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
    }

    .pill.active {
      background: #fff;
      color: #000;
      font-weight: 700;
      border-color: #fff;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 4px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .empty-placeholder {
      text-align: center;
      padding: 30px 10px;
      color: var(--ig-text-sub);
      font-size: 13px;
      line-height: 1.6;
    }

    .store-card {
      background: var(--ig-card);
      border: 1px solid var(--ig-border);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      position: relative;
    }

    .store-card.is-unlocked {
      border: 1px solid rgba(220, 39, 67, 0.4);
      background: linear-gradient(135deg, rgba(220, 39, 67, 0.08), var(--ig-card));
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }

    .store-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .badge-status {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 700;
    }
    .badge-locked { background: #2c2c2e; color: #8e8e93; }
    .badge-unlocked { background: var(--ig-gradient); color: #fff; }

    .store-address {
      font-size: 11px;
      color: var(--ig-text-sub);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 6px;
    }

    .tag-pill {
      background: #000;
      color: #a1a1aa;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid #2a2a2e;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-heart {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .card-edit-btn {
      background: transparent;
      border: 1px solid var(--ig-border);
      color: var(--ig-text-sub);
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 6px;
      cursor: pointer;
    }

    .heart-burst {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 10;
      animation: igHeartBurst 0.75s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes igHeartBurst {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      45% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
    }

    /* ─── 地圖 ─── */
    #map {
      flex: 1;
      height: 100%;
      width: 100%;
      background: #09090b;
    }

    /* 暗黑主題風格化圖層切換選單 */
    .leaflet-control-layers {
      background: var(--ig-panel) !important;
      color: var(--ig-text-main) !important;
      border: 1px solid var(--ig-border) !important;
      border-radius: 12px !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8) !important;
      padding: 8px 12px !important;
      font-size: 12px !important;
      font-weight: 500;
    }
    .leaflet-control-layers-toggle {
      filter: invert(1);
    }
    .leaflet-control-layers label {
      margin: 4px 0 !important;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .marker-unlocked {
      background: var(--ig-gradient);
      box-shadow: 0 0 12px var(--ig-gradient-glow);
      padding: 2px;
    }

    .marker-unlocked-inner {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .marker-locked {
      background: #27272a;
      border: 1.5px solid #3f3f46;
      opacity: 0.85;
    }

    .leaflet-popup-content-wrapper {
      background: var(--ig-card) !important;
      color: var(--ig-text-main) !important;
      border: 1px solid var(--ig-border);
      border-radius: 12px;
    }
    .leaflet-popup-tip { background: var(--ig-card) !important; }

    .popup-container {
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 220px;
    }
    .popup-title { font-size: 13px; font-weight: 700; color: #fff; }
    .popup-address { font-size: 11px; color: var(--ig-text-sub); line-height: 1.3; }
    .popup-coords { font-size: 10px; color: #71717a; }
    .popup-meta { font-size: 10px; color: var(--ig-text-sub); }
    
    .popup-btn-row {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }
    .btn-toggle {
      flex: 1;
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    .btn-toggle.unlock { background: var(--ig-gradient); color: #fff; }
    .btn-toggle.relock { background: #27272a; color: #e4e4e7; }
    .btn-edit { background: #27272a; color: #fff; border: 1px solid var(--ig-border); border-radius: 6px; padding: 4px 6px; font-size: 10px; }
    .btn-delete { background: #3f1d24; color: #ff453a; border: 1px solid #5c202a; border-radius: 6px; padding: 4px 6px; font-size: 10px; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: var(--ig-panel);
      border: 1px solid var(--ig-border);
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; color: var(--ig-text-sub); font-weight: 600; }
    .form-control {
      background: #000;
      border: 1px solid var(--ig-border);
      padding: 8px 10px;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
    }
    .coords-info {
      font-size: 10px;
      color: var(--ig-text-sub);
      background: #000;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--ig-border);
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .btn-secondary { background: #27272a; color: #fff; padding: 6px 12px; border: none; border-radius: 6px; font-size: 12px; }
    .btn-primary { background: var(--ig-blue); color: #fff; font-weight: 700; padding: 6px 14px; border: none; border-radius: 6px; font-size: 12px; }

    /* ─── 📱 手機專屬響應式設計 ─── */
    @media (max-width: 768px) {
      :root {
        --sidebar-width: 86vw;
      }

      #sidebar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        max-width: 380px;
        box-shadow: 8px 0 28px rgba(0, 0, 0, 0.95);
      }

      .sidebar-toggle-btn {
        right: -32px;
        width: 32px;
        height: 64px;
        font-size: 14px;
        background: #18181b;
        border-color: #3f3f46;
      }
    }
  </style>
</head>
<body>

  <!-- 全螢幕登入鎖定攔截畫面 -->
  <div id="auth-lock-screen">
    <div class="lock-card">
      <div class="lock-logo-ring">
        <div class="lock-logo-inner">🌱</div>
      </div>
      <div>
        <h2 class="lock-title">蔬食探索星圖</h2>
        <p class="lock-subtitle" style="margin-top: 6px;">🔒 本星圖僅限受邀授權帳號訪問</p>
      </div>
      <button class="btn-google-login" onclick="handleAuth()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        使用 Google 授權帳號登入
      </button>
    </div>
  </div>

  <div id="sidebar">
    <button class="sidebar-toggle-btn" id="sidebar-toggle" onclick="toggleSidebar()" title="收合/展開側邊欄">◀</button>

    <div class="sidebar-header">
      <div class="title-row">
        <h1 class="brand-title">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          蔬食星圖
        </h1>
        <div class="btn-action-group">
          <button class="btn-icon" onclick="handleAuth()" title="登出帳號">登出</button>
          <button class="btn-icon" onclick="document.getElementById('import-file').click()" title="載入備份 JSON">匯入</button>
          <input type="file" id="import-file" style="display:none" onchange="importData(event)" accept=".json" />
          <button class="btn-icon" onclick="exportData()" title="備份名單">匯出</button>
          <button class="btn-icon" onclick="clearAllStores()" title="清空所有店家">清空</button>
        </div>
      </div>
    </div>

    <!-- IG Stories 限時動態分類列 -->
    <div class="stories-bar">
      <div class="story-item active" onclick="setCategoryFilter('all', this)">
        <div class="story-ring-sm"><div class="story-avatar-sm">✨</div></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase 與核心邏輯模組 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      doc, 
      writeBatch,
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // ──────────────────────────────────────────
    // 🛡️ 授權白名單（請填入允許登入的 Google 信箱）
    // ──────────────────────────────────────────
    const ALLOWED_EMAILS = [
      "tp6u4jo6@gmail.com",
    ];

    const firebaseConfig = {
      apiKey: "AIzaSyCI9IfeQEa37kdx5ZSqtFvpsm9z3oa9n-Y",
      authDomain: "hsinchu-veg-map.firebaseapp.com",
      projectId: "hsinchu-veg-map",
      storageBucket: "hsinchu-veg-map.firebasestorage.app",
      messagingSenderId: "229294662793",
      appId: "1:229294662793:web:d467459c29f46eb0aed258"
    };

    let db = null;
    let auth = null;
    let googleProvider = null;
    let storesCollection = null;
    let isFirebaseReady = false;
    let currentUser = null;
    let unsubscribeFirestore = null;

    if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
        googleProvider = new GoogleAuthProvider();
        storesCollection = collection(db, "vegan_stores");
        isFirebaseReady = true;

        onAuthStateChanged(auth, async (user) => {
          const lockScreen = document.getElementById('auth-lock-screen');
          const avatarEl = document.getElementById('user-avatar');

          if (user) {
            if (!ALLOWED_EMAILS.includes(user.email)) {
              alert(`⛔ 存取被拒絕！\n\n帳號【${user.email}】不在授權白名單中。`);
              currentUser = null;
              await signOut(auth);
              lockScreen.style.display = 'flex';
              return;
            }

            currentUser = user;
            lockScreen.style.display = 'none';

            if (user.photoURL) {
              avatarEl.innerHTML = `<img src="${user.photoURL}" alt="avatar" />`;
            } else {
              avatarEl.innerText = '👤';
            }

            if (!unsubscribeFirestore) {
              unsubscribeFirestore = onSnapshot(storesCollection, (snapshot) => {
                stores = snapshot.docs.map(d => ({
                  id: d.id,
                  ...d.data()
                }));
                refreshAll();
              }, (err) => {
                console.error("Firestore 錯誤:", err);
              });
            }

            setTimeout(() => {
              map.invalidateSize();
            }, 200);

          } else {
            currentUser = null;
            lockScreen.style.display = 'flex';
            stores = [];
            if (unsubscribeFirestore) {
              unsubscribeFirestore();
              unsubscribeFirestore = null;
            }
            refreshAll();
          }
        });

      } catch (err) {
        console.warn("Firebase 初始化失敗", err);
      }
    }

    let stores = [];

    const map = L.map('map', { center: [24.805, 120.975], zoom: 13, zoomControl: false });
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ─── 4 種多元風格底圖圖層定義 ───
    const darkLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 16
    });

    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    });

    const taiwanLayer = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
      attribution: '&copy; 內政部國土測繪中心',
      maxZoom: 19
    });

    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 18
    });

    // 預設載入極簡暗黑圖層
    darkLayer.addTo(map);

    // 右上角底圖切換控制面板
    const baseMaps = {
      "🌑 極簡暗黑": darkLayer,
      "🗺️ 開源街景": osmLayer,
      "🇹🇼 臺灣通用地圖": taiwanLayer,
      "🛰️ 衛星空照": satelliteLayer
    };

    L.control.layers(baseMaps, null, { position: 'topright', collapsed: true }).addTo(map);

    const constellationLayer = L.layerGroup().addTo(map);
    const markersLayer = L.layerGroup().addTo(map);
    const markersRef = {};

    if (window.innerWidth <= 768) {
      document.getElementById('sidebar').classList.add('collapsed');
      document.getElementById('sidebar-toggle').innerText = '▶';
    }

    window.toggleSidebar = function() {
      const sidebar = document.getElementById('sidebar');
      const toggleBtn = document.getElementById('sidebar-toggle');
      sidebar.classList.toggle('collapsed');

      toggleBtn.innerText = sidebar.classList.contains('collapsed') ? '▶' : '◀';

      const startTime = performance.now();
      function resizeLoop(now) {
        map.invalidateSize();
        if (now - startTime < 380) {
          requestAnimationFrame(resizeLoop);
        }
      }
      requestAnimationFrame(resizeLoop);
    };

    window.handleAuth = async function() {
      if (!isFirebaseReady) {
        alert('請先填入正確的 firebaseConfig！');
        return;
      }
      if (currentUser) {
        if (confirm(`確定要登出【${currentUser.displayName || currentUser.email}】嗎？`)) {
          await signOut(auth);
        }
      } else {
        try {
          await signInWithPopup(auth, googleProvider);
        } catch (err) {
          console.error("登入失敗:", err);
          alert(`登入失敗：${err.message}`);
        }
      }
    };

    function playSparkleSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const t = ctx.currentTime;
        [587.33, 739.99, 880, 1174.66].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + idx * 0.08);
          gain.gain.setValueAtTime(0.15, t + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.08 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t + idx * 0.08);
          osc.stop(t + idx * 0.08 + 0.35);
        });
      } catch (e) {}
    }

    function calculateRank(visitedCount, total) {
      if (total === 0 || visitedCount === 0) return '🌱 蔬食初探者';
      const pct = Math.round((visitedCount / total) * 100);

      if (pct === 100) return '👑 蔬食星域主宰';
      if (pct >= 80 || visitedCount >= 15) return '🌟 蔬食星圖領航星';
      if (pct >= 60 || visitedCount >= 10) return '✨ 綠光導航員';
      if (pct >= 40 || visitedCount >= 6) return '🍃 植感生活達人';
      if (pct >= 20 || visitedCount >= 3) return '🌿 巷弄綠食行者';
      return '🌱 蔬食初探者';
    }

    function checkDuplicateStore(name, lat, lng, excludeId = null) {
      const cleanName = name.trim().toLowerCase();
      const DISTANCE_THRESHOLD = 0.0001;

      return stores.find(s => {
        if (excludeId && s.id === excludeId) return false;
        const sameName = s.name.trim().toLowerCase() === cleanName;
        const sameLocation = Math.abs(s.lat - lat) < DISTANCE_THRESHOLD && Math.abs(s.lng - lng) < DISTANCE_THRESHOLD;
        return sameName || sameLocation;
      });
    }

    async function reverseGeocode(lat, lng) {
      const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.address) {
          const addr = data.address;
          const road = addr.road || addr.pedestrian || addr.street || '';
          const house = addr.house_number ? `${addr.house_number}號` : '';
          const suburb = addr.suburb || addr.district || '';
          const city = addr.city || addr.county || '';
          return `${city}${suburb}${road}${house}` || data.display_name.split(',')[0];
        }
      } catch (err) {}
      return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }

    async function parseLocationInput(input) {
      if (!input) return null;
      const str = input.trim();

      const coordMatch = str.match(/^(-?\d+\.\d+)\s*[,，\s]\s*(-?\d+\.\d+)$/);
      if (coordMatch) {
        const lat = parseFloat(coordMatch[1]);
        const lng = parseFloat(coordMatch[2]);
        const addr = await reverseGeocode(lat, lng);
        return { lat, lng, address: addr, isExactCoord: true };
      }

      const atMatch = str.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
      const qMatch = str.match(/[?&](?:q|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/);
      if (atMatch || qMatch) {
        const match = atMatch || qMatch;
        const lat = parseFloat(match[1]);
        const lng = parseFloat(match[2]);
        const addr = await reverseGeocode(lat, lng);
        return { lat, lng, address: addr, isExactCoord: true };
      }

      let cleanAddr = str.replace(/^台灣省?/, '').replace(/[0-9]{3,5}/, '').replace(/[0-9]+[Ff樓].*$/, '').trim();
      const queries = [
        cleanAddr,
        cleanAddr.replace(/[0-9]+號.*$/, ''),
        cleanAddr.replace(/([0-9]+巷|[0-9]+弄|[0-9]+號).*$/, ''),
        cleanAddr.match(/(.+?[市縣].+?[區鄉鎮市]|.+?[路街大道])/)?.[0] || ''
      ].map(q => q ? q.trim() : '').filter(q => q && q.length >= 3);

      for (const q of [...new Set(queries)]) {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1&countrycodes=tw`;
        try {
          const res = await fetch(url);
          const data = await res.json();
          if (data && data.length > 0) {
            return {
              lat: parseFloat(data[0].lat),
              lng: parseFloat(data[0].lon),
              address: str,
              isExactCoord: false
            };
          }
        } catch (err) {}
        await new Promise(r => setTimeout(r, 200));
      }
      return null;
    }

    window.handleQuickAdd = async function() {
      if (!currentUser) return alert('請先登入！');

      const input = document.getElementById('gmaps-input').value.trim();
      if (!input) return;

      const btn = document.getElementById('btn-quick-submit');
      btn.innerText = '處理中...';
      btn.disabled = true;

      const result = await parseLocationInput(input);

      btn.innerText = '新增';
      btn.disabled = false;

      if (result) {
        let nameMatch = input.match(/place\/([^/@?]+)/);
        let defaultName = nameMatch ? decodeURIComponent(nameMatch[1].replace(/\+/g, ' ')) : '新店家';

        const storeName = prompt(`📍 已鎖定座標 (${result.lat.toFixed(5)}, ${result.lng.toFixed(5)})\n請確認或輸入店家名稱：`, defaultName);
        if (storeName !== null) {
          const finalName = storeName.trim() || defaultName;
          
          const dup = checkDuplicateStore(finalName, result.lat, result.lng);
          if (dup) {
            alert(`⚠️ 店家已存在！\n已有相同名稱或相同位置的店家：「${dup.name}」`);
            focusStore(dup.id);
            return;
          }

          const newStoreData = {
            name: finalName,
            address: result.address,
            lat: result.lat,
            lng: result.lng,
            category: '蛋奶素',
            visited: false,
            createdAt: serverTimestamp ? serverTimestamp() : Date.now()
          };

          const docRef = await addDoc(storesCollection, newStoreData);
          document.getElementById('gmaps-input').value = '';
          focusStore(docRef.id);
        }
      } else {
        alert('無法辨識此位置或座標，請確認輸入內容！');
      }
    };

    function renderConstellation() {
      constellationLayer.clearLayers();
      const visitedStores = stores.filter(s => s.visited);

      if (visitedStores.length >= 2) {
        const latlngs = visitedStores.map(s => [s.lat, s.lng]);
        L.polyline(latlngs, { color: '#dc2743', weight: 5, opacity: 0.35, lineJoin: 'round' }).addTo(constellationLayer);
        L.polyline(latlngs, { color: '#f09433', weight: 2, dashArray: '6, 6', opacity: 0.9 }).addTo(constellationLayer);
      }
    }

    function renderMarkers() {
      markersLayer.clearLayers();

      stores.forEach(s => {
        const iconHtml = `
          <div class="custom-marker ${s.visited ? 'marker-unlocked' : 'marker-locked'}" 
               style="width:${s.visited ? '26px' : '18px'}; height:${s.visited ? '26px' : '18px'}; font-size:10px;">
            <div class="${s.visited ? 'marker-unlocked-inner' : ''}">
              ${s.visited ? '❤️' : '🌱'}
            </div>
          </div>
        `;

        const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [26, 26], iconAnchor: [13, 13] });
        const marker = L.marker([s.lat, s.lng], { icon: customIcon }).addTo(markersLayer);
        markersRef[s.id] = marker;

        const popupContent = `
          <div class="popup-container">
            <div class="popup-title">${s.name}</div>
            <div class="popup-address">📍 ${s.address || '無地址資訊'}</div>
            <div class="popup-coords">🎯 ${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}</div>
            <div class="popup-meta">${s.category || '蔬食'} ｜ ${s.visited ? '❤️ 已打卡' : '🔖 待造訪'}</div>
            <div class="popup-btn-row">
              <button class="btn-toggle ${s.visited ? 'relock' : 'unlock'}" onclick="toggleVisited('${s.id}')">
                ${s.visited ? '取消打卡' : '❤️ 打卡'}
              </button>
              <button class="btn-edit" onclick="openEditModal('${s.id}')">✏️ 編輯</button>
              <button class="btn-delete" onclick="deleteStore('${s.id}')">刪除</button>
            </div>
          </div>
        `;
        marker.bindPopup(popupContent);
      });
    }

    let currentFilter = 'all';
    let currentCategory = 'all';
    let searchKeyword = '';

    window.setCategoryFilter = function(cat, el) {
      currentCategory = cat;
      document.querySelectorAll('.story-item').forEach(item => item.classList.remove('active'));
      if (el) el.classList.add('active');
      updateSidebar();
    };

    function updateSidebar() {
      const listEl = document.getElementById('restaurant-list');
      listEl.innerHTML = '';

      const total = stores.length;
      const visitedCount = stores.filter(s => s.visited).length;
      const pct = total > 0 ? Math.round((visitedCount / total) * 100) : 0;

      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-visited').innerText = visitedCount;
      document.getElementById('stat-pct').innerText = `${pct}%`;
      document.getElementById('stat-ratio-text').innerText = `${visitedCount} / ${total}`;
      document.getElementById('progress-bar').style.width = `${pct}%`;
      document.getElementById('rank-name').innerText = calculateRank(visitedCount, total);

      const filtered = stores.filter(s => {
        let matchFilter = true;
        if (currentFilter === 'unlocked') matchFilter = s.visited;
        else if (currentFilter === 'locked') matchFilter = !s.visited;

        let matchCategory = true;
        if (currentCategory !== 'all') {
          matchCategory = s.category && s.category.includes(currentCategory);
        }
        
        const q = searchKeyword;
        const matchSearch = s.name.toLowerCase().includes(q) || 
                            (s.address && s.address.toLowerCase().includes(q)) || 
                            (s.category && s.category.toLowerCase().includes(q));
        return matchFilter && matchCategory && matchSearch;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="empty-placeholder">
            目前還沒有符合條件的貼文。<br/>
            💡 輸入經緯度/地址或點擊地圖即可建立第一筆打卡！
          </div>
        `;
        return;
      }

      filtered.forEach((s) => {
        const card = document.createElement('div');
        card.className = `store-card ${s.visited ? 'is-unlocked' : ''}`;

        card.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          if (!s.visited) toggleVisited(s.id);
          const burst = document.createElement('div');
          burst.className = 'heart-burst';
          burst.innerHTML = `<span style="font-size: 46px;">❤️</span>`;
          card.appendChild(burst);
          setTimeout(() => burst.remove(), 750);
        });

        card.innerHTML = `
          <div class="card-top">
            <div class="store-title-group">
              <span class="store-title">${s.name}</span>
            </div>
            <span class="badge-status ${s.visited ? 'badge-unlocked' : 'badge-locked'}">
              ${s.visited ? '❤️ 已打卡' : '待造訪'}
            </span>
          </div>
          <div class="store-address">📍 ${s.address || `${s.lat.toFixed(4)}, ${s.lng.toFixed(4)}`}</div>
          <div class="card-bottom">
            <div class="tag-row">
              <span class="tag-pill">${s.category || '蔬食'}</span>
            </div>
            <div class="card-actions">
              <button class="btn-heart" title="${s.visited ? '取消打卡' : '點亮愛心打卡'}" onclick="event.stopPropagation(); toggleVisited('${s.id}')">
                ${s.visited ? '❤️' : '🤍'}
              </button>
              <button class="card-edit-btn" onclick="event.stopPropagation(); openEditModal('${s.id}')">✏️ 編輯</button>
            </div>
          </div>
        `;
        card.onclick = () => focusStore(s.id);
        listEl.appendChild(card);
      });
    }

    window.focusStore = function(id) {
      const store = stores.find(s => s.id === id);
      if (store) {
        map.flyTo([store.lat, store.lng], 17, { duration: 0.6 });
        const marker = markersRef[id];
        if (marker) setTimeout(() => marker.openPopup(), 300);

        if (window.innerWidth <= 768) {
          const sidebar = document.getElementById('sidebar');
          if (!sidebar.classList.contains('collapsed')) {
            toggleSidebar();
          }
        }
      }
    };

    window.toggleVisited = async function(id) {
      if (!currentUser) return alert('請先登入！');
      const target = stores.find(s => s.id === id);
      if (target) {
        const nextState = !target.visited;
        if (nextState) playSparkleSound();
        const storeDoc = doc(db, "vegan_stores", id);
        await updateDoc(storeDoc, { visited: nextState });
        map.closePopup();
      }
    };

    window.deleteStore = async function(id) {
      if (!currentUser) return alert('請先登入！');
      if (confirm('確定要刪除這間店家貼文嗎？')) {
        const storeDoc = doc(db, "vegan_stores", id);
        await deleteDoc(storeDoc);
      }
    };

    window.clearAllStores = async function() {
      if (!currentUser) return alert('請先登入！');
      if (confirm('⚠️ 確定要清空所有店家名單嗎？')) {
        const batch = writeBatch(db);
        stores.forEach(s => {
          const storeDoc = doc(db, "vegan_stores", s.id);
          batch.delete(storeDoc);
        });
        await batch.commit();
      }
    };

    window.setFilter = function(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      updateSidebar();
    };

    window.handleSearch = function(val) {
      searchKeyword = val.trim().toLowerCase();
      updateSidebar();
    };

    function refreshAll() {
      renderConstellation();
      renderMarkers();
      updateSidebar();
    }

    map.on('click', async (e) => {
      if (!currentUser) return alert('請先登入！');
      document.getElementById('modal-title').innerText = '📍 新增打卡店家';
      document.getElementById('form-id').value = '';
      document.getElementById('form-name').value = '';
      document.getElementById('form-category').value = '蛋奶素';
      document.getElementById('form-lat').value = e.latlng.lat;
      document.getElementById('form-lng').value = e.latlng.lng;
      document.getElementById('form-coords-display').innerText = `🎯 鎖定座標：${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
      document.getElementById('form-address').value = '取得地址中...';
      document.getElementById('form-visited').value = 'false';
      document.getElementById('modal').classList.add('active');

      const addr = await reverseGeocode(e.latlng.lat, e.latlng.lng);
      document.getElementById('form-address').value = addr;
    });

    window.openEditModal = function(id) {
      if (!currentUser) return alert('請先登入！');
      const store = stores.find(s => s.id === id);
      if (!store) return;

      document.getElementById('modal-title').innerText = '✏️ 編輯貼文資訊';
      document.getElementById('form-id').value = store.id;
      document.getElementById('form-name').value = store.name;
      document.getElementById('form-address').value = store.address || '';
      document.getElementById('form-category').value = store.category || '蛋奶素';
      document.getElementById('form-lat').value = store.lat;
      document.getElementById('form-lng').value = store.lng;
      document.getElementById('form-coords-display').innerText = `🎯 鎖定座標：${store.lat.toFixed(5)}, ${store.lng.toFixed(5)}`;
      document.getElementById('form-visited').value = store.visited ? 'true' : 'false';
      
      map.closePopup();
      document.getElementById('modal').classList.add('active');
    };

    window.closeModal = function() {
      document.getElementById('modal').classList.remove('active');
    };

    window.saveFormStore = async function() {
      if (!currentUser) return alert('請先登入！');

      const editId = document.getElementById('form-id').value;
      const name = document.getElementById('form-name').value.trim();
      let address = document.getElementById('form-address').value.trim();
      const category = document.getElementById('form-category').value.trim() || '蛋奶素';
      const visited = document.getElementById('form-visited').value === 'true';
      let lat = parseFloat(document.getElementById('form-lat').value);
      let lng = parseFloat(document.getElementById('form-lng').value);

      if (!name) return alert('請輸入店名！');

      const coordMatch = address.match(/^(-?\d+\.\d+)\s*[,，\s]\s*(-?\d+\.\d+)$/);
      if (coordMatch) {
        lat = parseFloat(coordMatch[1]);
        lng = parseFloat(coordMatch[2]);
        address = await reverseGeocode(lat, lng);
      }

      if (isNaN(lat) || isNaN(lng)) {
        lat = 24.805;
        lng = 120.975;
      }

      const dup = checkDuplicateStore(name, lat, lng, editId || null);
      if (dup) {
        alert(`⚠️ 無法儲存：已存在名稱相同或位置重複的店家「${dup.name}」！`);
        return;
      }

      const storePayload = {
        name,
        address: address || `${lat.toFixed(5)}, ${lng.toFixed(5)}`,
        category,
        visited,
        lat,
        lng
      };

      if (editId) {
        const storeDoc = doc(db, "vegan_stores", editId);
        await updateDoc(storeDoc, storePayload);
      } else {
        storePayload.createdAt = serverTimestamp ? serverTimestamp() : Date.now();
        await addDoc(storesCollection, storePayload);
        if (visited) playSparkleSound();
      }

      closeModal();
      if (editId) {
        focusStore(editId);
      }
    };

    window.exportData = function() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stores, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `my_veg_map_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    window.importData = async function(event) {
      if (!currentUser) return alert('請先登入授權帳號才能執行匯入！');
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        let imported = [];
        try {
          imported = JSON.parse(e.target.result);
        } catch (parseErr) {
          alert(`❌ JSON 格式解析失敗：\n${parseErr.message}`);
          return;
        }

        if (!Array.isArray(imported)) {
          alert('❌ 匯入失敗：JSON 檔案最外層必須是 [ ] 陣列清單！');
          return;
        }

        if (isFirebaseReady) {
          try {
            const batch = writeBatch(db);
            imported.forEach(item => {
              const docId = item.id ? String(item.id) : doc(storesCollection).id;
              const newDocRef = doc(db, "vegan_stores", docId);

              batch.set(newDocRef, {
                name: item.name || '未命名',
                address: item.address || '',
                category: item.category || '蛋奶素',
                visited: Boolean(item.visited),
                lat: typeof item.lat === 'number' ? item.lat : parseFloat(item.lat) || 24.805,
                lng: typeof item.lng === 'number' ? item.lng : parseFloat(item.lng) || 120.975,
                visitedUsers: Array.isArray(item.visitedUsers) ? item.visitedUsers : [],
                creatorId: item.creatorId || currentUser.uid,
                createdAt: Date.now()
              });
            });

            await batch.commit();
            alert(`✅ 成功匯入 ${imported.length} 筆店家到雲端資料庫！`);
          } catch (dbErr) {
            console.error("Firestore 寫入錯誤：", dbErr);
            alert(`❌ Firestore 寫入失敗！\n代碼：${dbErr.code || '未知'}\n原因：${dbErr.message}`);
          }
        }
        event.target.value = '';
      };
      reader.readAsText(file, 'UTF-8');
    };

    refreshAll();
  </script>
</body>
</html>
